<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICU資料ライブラリ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     ▼▼▼ ① ここに Supabase の接続情報を貼ってください ▼▼▼
     STAT/VENT の index.html の先頭にある SUPABASE_URL と
     SUPABASE_ANON_KEY を、そのままコピーして下の JS（②）に貼ります。
     （このコメントは目印。実際の貼り付け場所は下の <script> 内）
     ============================================================ */

  :root{
    --bg:#f4f6f8; --surface:#ffffff; --ink:#1b2733; --ink-soft:#5b6b7b;
    --line:#e2e8ef; --teal:#0d8a8a; --teal-deep:#0a6b6b; --teal-soft:#e6f4f4;
    --blue:#2b6cb0; --green:#2f855a; --amber:#c05621;
    --shadow:0 1px 3px rgba(20,40,60,.08),0 6px 20px rgba(20,40,60,.06);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;line-height:1.6;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit;font-size:15px}

  /* ---------- ログイン ---------- */
  #login{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#0a6b6b,#0d8a8a 60%,#13a0a0);padding:20px;
  }
  .login-card{
    background:var(--surface);border-radius:20px;padding:40px 34px;width:100%;max-width:380px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:center;
  }
  .login-card .logo{font-size:34px}
  .login-card h1{font-size:21px;margin:10px 0 4px;letter-spacing:.02em}
  .login-card p{color:var(--ink-soft);font-size:13px;margin-bottom:24px}
  .field{text-align:left;margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px}
  .field input{
    width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;
    transition:border-color .15s;
  }
  .field input:focus{outline:none;border-color:var(--teal)}
  .btn-primary{
    width:100%;background:var(--teal);color:#fff;font-weight:700;padding:13px;
    border-radius:10px;font-size:15px;transition:background .15s;margin-top:6px;
  }
  .btn-primary:hover{background:var(--teal-deep)}
  .login-err{color:#c0392b;font-size:13px;min-height:18px;margin-top:10px}

  /* ---------- アプリ枠 ---------- */
  #app{display:none;min-height:100vh}
  header.topbar{
    background:var(--surface);border-bottom:1px solid var(--line);
    padding:0 20px;display:flex;align-items:center;gap:18px;height:60px;
    position:sticky;top:0;z-index:30;
  }
  .brand{font-weight:900;font-size:18px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
  .brand .dot{color:var(--teal)}
  .tabs{display:flex;gap:4px;margin-left:8px}
  .tab{
    padding:8px 16px;border-radius:9px;font-weight:700;font-size:14px;color:var(--ink-soft);
  }
  .tab.active{background:var(--teal-soft);color:var(--teal-deep)}
  .spacer{flex:1}
  .who{font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:10px}
  .who .role{background:var(--teal-soft);color:var(--teal-deep);padding:3px 10px;border-radius:20px;font-weight:700;font-size:12px}
  .logout{font-size:13px;color:var(--ink-soft);text-decoration:underline}

  main{max-width:1080px;margin:0 auto;padding:24px 20px 60px}

  /* ---------- 検索バー ---------- */
  .searchbar{position:relative;margin-bottom:22px}
  .searchbar input{
    width:100%;padding:13px 16px 13px 44px;border:1.5px solid var(--line);
    border-radius:12px;background:var(--surface);box-shadow:var(--shadow);
  }
  .searchbar input:focus{outline:none;border-color:var(--teal)}
  .searchbar .ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--ink-soft)}

  /* ---------- パンくず ---------- */
  .crumbs{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:18px;flex-wrap:wrap}
  .crumbs a{color:var(--teal-deep);font-weight:700;text-decoration:none;cursor:pointer}
  .crumbs span{color:var(--ink-soft)}

  /* ---------- カテゴリーカード ---------- */
  .cat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
  .cat-card{
    background:var(--surface);border-radius:var(--radius);padding:26px 22px;box-shadow:var(--shadow);
    border:1px solid var(--line);text-align:left;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden;
  }
  .cat-card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(20,40,60,.12)}
  .cat-card .emoji{font-size:30px}
  .cat-card h3{font-size:19px;margin:10px 0 4px}
  .cat-card p{font-size:13px;color:var(--ink-soft)}
  .cat-card .bar{position:absolute;left:0;top:0;bottom:0;width:5px}
  .cat-card .count{margin-top:12px;font-size:12px;color:var(--ink-soft);font-weight:700}
  .c-bed .bar{background:#0d8a8a}
  .c-disease .bar{background:#2b6cb0}
  .c-drug .bar{background:#6b46c1}
  .c-device .bar{background:#dd6b20}
  .c-work .bar{background:#2f855a}
  .c-organ .bar{background:#c53030}

  /* ---------- サブカテゴリーチップ ---------- */
  .sub-grid{display:flex;flex-wrap:wrap;gap:10px}
  .sub-chip{
    background:var(--surface);border:1.5px solid var(--line);border-radius:30px;
    padding:10px 20px;font-weight:700;font-size:15px;box-shadow:var(--shadow);transition:.15s;
  }
  .sub-chip:hover{border-color:var(--teal);color:var(--teal-deep)}
  .sub-chip .n{color:var(--ink-soft);font-weight:500;font-size:13px;margin-left:6px}

  /* ---------- 資料リスト ---------- */
  .res-list{display:flex;flex-direction:column;gap:10px}
  .res-item{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;
    box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;transition:.15s;text-align:left;width:100%;
  }
  .res-item:hover{border-color:var(--teal);transform:translateX(2px)}
  .res-item .pdf-ico{font-size:24px;flex-shrink:0}
  .res-item .meta{flex:1;min-width:0}
  .res-item .meta .t{font-weight:700;font-size:16px;margin-bottom:3px}
  .res-item .meta .sub{font-size:12px;color:var(--ink-soft)}
  .res-item .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
  .tag{background:var(--teal-soft);color:var(--teal-deep);font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
  .res-item .stat{font-size:12px;color:var(--ink-soft);text-align:right;flex-shrink:0;line-height:1.7}
  .res-item .stat b{color:var(--ink)}

  .empty{text-align:center;color:var(--ink-soft);padding:50px 20px;font-size:15px}

  /* ---------- PDFモーダル ---------- */
  .modal-bg{
    display:none;position:fixed;inset:0;background:rgba(10,30,40,.55);z-index:100;
    align-items:center;justify-content:center;padding:20px;
  }
  .modal-bg.show{display:flex}
  .pdf-modal{
    background:var(--surface);border-radius:16px;width:100%;max-width:900px;height:90vh;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .pdf-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}
  .pdf-head .t{font-weight:700;font-size:17px;flex:1;min-width:0}
  .pdf-head .x{font-size:22px;color:var(--ink-soft);padding:4px 8px}
  .pdf-frame{flex:1;border:none;width:100%;background:#525659}
  .pdf-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .like-btn{
    display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);
    border-radius:30px;padding:9px 18px;font-weight:700;font-size:15px;transition:.15s;color:var(--ink);
  }
  .like-btn:hover{border-color:var(--teal)}
  .like-btn.liked{background:#fff4e6;border-color:var(--amber);color:var(--amber)}
  .pdf-foot .views{font-size:13px;color:var(--ink-soft)}
  .pdf-foot .dl{margin-left:auto;font-size:14px;color:var(--teal-deep);font-weight:700;text-decoration:none}

  /* ---------- 管理画面 ---------- */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:22px}
  .panel h2{font-size:17px;margin-bottom:18px;display:flex;align-items:center;gap:8px}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  .form-row.full{grid-template-columns:1fr}
  .form-group label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px}
  .form-group input,.form-group select{
    width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;background:#fff;
  }
  .form-group input:focus,.form-group select:focus{outline:none;border-color:var(--teal)}
  .hint{font-size:11px;color:var(--ink-soft);margin-top:4px}
  .file-drop{
    border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--ink-soft);
    cursor:pointer;transition:.15s;
  }
  .file-drop:hover{border-color:var(--teal);background:var(--teal-soft)}
  .file-drop.has{border-color:var(--teal);color:var(--teal-deep);background:var(--teal-soft);font-weight:700}
  .upload-status{font-size:13px;margin-top:10px;min-height:18px}

  table.admin{width:100%;border-collapse:collapse;font-size:14px}
  table.admin th,table.admin td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
  table.admin th{font-size:12px;color:var(--ink-soft);font-weight:700;text-transform:none}
  table.admin td .mini{font-size:12px;color:var(--ink-soft)}
  .pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
  .pill.good{background:#e6f6ec;color:#2f855a}
  .pill.fix{background:#fdecea;color:#c0392b}
  .pill.bury{background:#fef5e7;color:#c05621}
  .pill.low{background:#eef0f2;color:#5b6b7b}
  .row-act{display:flex;gap:8px}
  .row-act button{font-size:12px;font-weight:700;padding:5px 11px;border-radius:7px}
  .btn-edit{background:var(--teal-soft);color:var(--teal-deep)}
  .btn-del{background:#fdecea;color:#c0392b}
  .btn-add{background:var(--teal);color:#fff;font-weight:700;padding:11px 22px;border-radius:9px}
  .btn-ghost{background:#eef0f2;color:var(--ink);font-weight:700;padding:11px 22px;border-radius:9px}
  .sort-note{font-size:12px;color:var(--ink-soft);margin-bottom:10px}

  /* 活用状況：登録状況サマリー */
  .stat-cards{display:flex;gap:14px;flex-wrap:wrap}
  .stat-card{flex:1;min-width:140px;background:var(--teal-soft);border-radius:12px;padding:16px 18px}
  .stat-card .num{font-size:30px;font-weight:900;color:var(--teal-deep);line-height:1.1}
  .stat-card .lbl{font-size:12px;font-weight:700;color:var(--ink-soft);margin-top:4px}
  .stat-card.warn{background:#fef5e7}
  .stat-card.warn .num{color:var(--amber)}
  .cat-bars{display:flex;flex-direction:column;gap:9px}
  .cat-bar-row{display:flex;align-items:center;gap:12px}
  .cb-name{width:150px;flex-shrink:0;font-size:13px;font-weight:700;color:var(--ink)}
  .cb-track{flex:1;height:14px;background:#eef0f2;border-radius:8px;overflow:hidden}
  .cb-fill{display:block;height:100%;border-radius:8px;background:var(--teal)}
  .cb-n{width:32px;flex-shrink:0;text-align:right;font-size:13px;font-weight:700;color:var(--ink-soft)}
  .cb-fill.c-bed{background:#0d8a8a} .cb-fill.c-disease{background:#2b6cb0} .cb-fill.c-drug{background:#6b46c1}
  .cb-fill.c-device{background:#dd6b20} .cb-fill.c-work{background:#2f855a} .cb-fill.c-organ{background:#c53030}
  @media(max-width:620px){ .cb-name{width:108px;font-size:12px} }

  @media(max-width:620px){
    .form-row{grid-template-columns:1fr}
    .tabs .tab{padding:8px 11px;font-size:13px}
    .brand{font-size:16px}
    main{padding:18px 14px 50px}
    .res-item .stat{display:none}
  }
</style>
</head>
<body>

<!-- ===================== ログイン ===================== -->
<div id="login">
  <div class="login-card">
    <div class="logo">📚</div>
    <h1>ICU資料ライブラリ</h1>
    <p>IDとパスワードを入力してください</p>
    <div class="field">
      <label>ID</label>
      <input id="loginId" type="text" autocomplete="username" placeholder="ID">
    </div>
    <div class="field">
      <label>パスワード</label>
      <input id="loginPw" type="password" autocomplete="current-password" placeholder="パスワード">
    </div>
    <button class="btn-primary" onclick="doLogin()">ログイン</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- ===================== アプリ本体 ===================== -->
<div id="app">
  <header class="topbar">
    <div class="brand">📚 ICU資料ライブラリ<span class="dot">.</span></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="spacer"></div>
    <div class="who">
      <span class="role" id="roleLabel"></span>
      <a class="logout" onclick="openPwModal()">パスワード変更</a>
      <a class="logout" onclick="doLogout()">ログアウト</a>
    </div>
  </header>
  <main id="content"></main>
</div>

<!-- ===================== PDFプレビュー モーダル ===================== -->
<div class="modal-bg" id="pdfModal">
  <div class="pdf-modal">
    <div class="pdf-head">
      <span class="t" id="pdfTitle"></span>
      <button class="x" onclick="closePdf()">✕</button>
    </div>
    <iframe class="pdf-frame" id="pdfFrame" title="PDF"></iframe>
    <div class="pdf-foot">
      <button class="like-btn" id="likeBtn" onclick="toggleLike()">👍 役に立った <span id="likeCount">0</span></button>
      <span class="views">閲覧 <b id="viewCount">0</b> 回</span>
      <a class="dl" id="dlLink" href="#" target="_blank" rel="noopener">⬇ ダウンロード</a>
    </div>
  </div>
</div>

<!-- ===================== アップロード/編集 モーダル ===================== -->
<div class="modal-bg" id="formModal">
  <div class="pdf-modal" style="max-width:560px;height:auto;max-height:92vh;overflow:auto">
    <div class="pdf-head">
      <span class="t" id="formTitle">資料を追加</span>
      <button class="x" onclick="closeForm()">✕</button>
    </div>
    <div style="padding:22px">
      <div class="form-group" style="margin-bottom:14px">
        <label>PDFファイル</label>
        <div class="file-drop" id="fileDrop" onclick="document.getElementById('fileInput').click()">
          クリックしてPDFを選択（PDFのみ）
        </div>
        <input type="file" id="fileInput" accept="application/pdf" style="display:none" onchange="onFilePick()">
        <div class="hint" id="fileHint"></div>
      </div>
      <div class="form-group" style="margin-bottom:14px">
        <label>タイトル</label>
        <input id="fTitle" type="text" placeholder="例）小児の人工呼吸器設定の基本">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>大カテゴリー</label>
          <select id="fCategory" onchange="refreshSubDatalist()"></select>
        </div>
        <div class="form-group">
          <label>サブカテゴリー</label>
          <input id="fSub" list="subList" placeholder="例）小児 / 心臓 / 面会">
          <datalist id="subList"></datalist>
          <div class="hint">既存の候補から選ぶと表記が揃います</div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>年度</label>
          <input id="fYear" list="yearList" placeholder="例）令和8年度">
          <datalist id="yearList"></datalist>
          <div class="hint">資料の版（改訂年度）の目印に</div>
        </div>
        <div class="form-group">
          <label>タグ（カンマ区切り・任意）</label>
          <input id="fTags" list="tagList" placeholder="例）人工呼吸器, 新生児">
          <datalist id="tagList"></datalist>
        </div>
      </div>
      <div class="upload-status" id="formStatus"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn-ghost" onclick="closeForm()">キャンセル</button>
        <button class="btn-add" id="formSubmit" onclick="submitForm()">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- ===================== パスワード変更 モーダル ===================== -->
<div class="modal-bg" id="pwModal">
  <div class="pdf-modal" style="max-width:440px;height:auto;max-height:92vh;overflow:auto">
    <div class="pdf-head">
      <span class="t">パスワードの変更</span>
      <button class="x" onclick="closePwModal()">✕</button>
    </div>
    <div style="padding:22px">
      <div class="hint" id="pwWho" style="margin-bottom:14px"></div>
      <div class="form-group" style="margin-bottom:14px">
        <label>新しいパスワード</label>
        <input id="pw1" type="password" autocomplete="new-password" placeholder="6文字以上">
        <div class="hint">英数字を混ぜると安全です</div>
      </div>
      <div class="form-group" style="margin-bottom:14px">
        <label>新しいパスワード（確認）</label>
        <input id="pw2" type="password" autocomplete="new-password" placeholder="もう一度入力">
      </div>
      <div class="upload-status" id="pwStatus"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn-ghost" onclick="closePwModal()">キャンセル</button>
        <button class="btn-add" id="pwSubmit" onclick="submitPwChange()">変更する</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   ② ここに Supabase の接続情報を貼ってください
   STAT/VENT の index.html 先頭にある2つの値をコピペしてください。
   ============================================================ */
const SUPABASE_URL      = 'https://qepfuorcodwenxzadbts.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFlcGZ1b3Jjb2R3ZW54emFkYnRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NjE3MzIsImV4cCI6MjA5NTQzNzczMn0.woYxAkG8q4mgfeuHrGo5OpbuQioV-9QiQoI1uQFMwi8';

/* ============================================================
   ③ ログインは Supabase Auth で管理します（ソースにパスワードは持ちません）
      ・管理者アカウント： admin@icu.local
      ・病棟アカウント　： ward@icu.local
      ログイン画面では「admin」「ward」だけ入力すればOK（内部で@icu.localを付与）
   ============================================================ */
const ADMIN_EMAIL  = 'admin@icu.local';   // このアカウントだけ管理者扱い
const EMAIL_DOMAIN = '@icu.local';        // ID → メール変換用
/* ============================================================ */

const CATEGORIES = [
  { key:'ベッドサイドファイル', cls:'c-bed',     emoji:'🛏️', desc:'ベッド周りで使う手引き' },
  { key:'疾患別',             cls:'c-disease', emoji:'🫀', desc:'小児・頭・心臓・輸血 など' },
  { key:'薬剤',               cls:'c-drug',    emoji:'💊', desc:'投与・希釈・配合 など' },
  { key:'医療機器',           cls:'c-device',  emoji:'🩺', desc:'人工呼吸器・ECMO・モニター' },
  { key:'業務',               cls:'c-work',    emoji:'📋', desc:'面会・駐車・運用ルール' },
  { key:'臓器移植',           cls:'c-organ',   emoji:'🤝', desc:'提供・連携の手順' },
];
const BUCKET = 'library-files';

let sb = null;
let state = { role:null, nav:'browse', cat:null, sub:null, search:'' };
let resources = [];          // 全資料キャッシュ
let current = null;          // プレビュー中の資料
const likedKey = 'icu_lib_liked';     // localStorage：👍済みID
const viewedKey = 'icu_lib_viewed';   // sessionStorage：閲覧済みID（重複カウント防止）

/* ---------------- 起動 ---------------- */
function initClient(){
  if(SUPABASE_URL.startsWith('ここに')||SUPABASE_ANON_KEY.startsWith('ここに')){
    return false;
  }
  if(!sb) sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  return true;
}
function roleFromEmail(email){ return (email||'').toLowerCase()===ADMIN_EMAIL ? 'admin' : 'ward'; }

window.addEventListener('DOMContentLoaded', async ()=>{
  if(!initClient()){
    document.getElementById('loginErr').textContent='接続情報が未設定です（コード②を確認）';
    return;
  }
  document.getElementById('loginPw').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
  // 既存のログインセッションがあれば復元
  const { data:{ session } } = await sb.auth.getSession();
  if(session && session.user){
    state.role = roleFromEmail(session.user.email);
    enterApp();
  }
});

/* ---------------- ログイン ---------------- */
async function doLogin(){
  const id = document.getElementById('loginId').value.trim();
  const pw = document.getElementById('loginPw').value;
  const err = document.getElementById('loginErr');
  if(!id || !pw){ err.textContent='IDとパスワードを入力してください'; return; }
  const email = id.includes('@') ? id : (id + EMAIL_DOMAIN);
  err.textContent='ログイン中…'; err.style.color='var(--ink-soft)';
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
  if(error || !data.user){ err.style.color='#c0392b'; err.textContent='IDまたはパスワードが違います'; return; }
  err.textContent='';
  state.role = roleFromEmail(data.user.email);
  enterApp();
}
async function doLogout(){
  try{ await sb.auth.signOut(); }catch(e){}
  location.reload();
}
function enterApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('roleLabel').textContent = state.role==='admin' ? '管理者' : '病棟';
  renderTabs();
  loadResources();
}

/* ---------------- パスワード変更（本人のアカウント） ---------------- */
function openPwModal(){
  document.getElementById('pw1').value='';
  document.getElementById('pw2').value='';
  document.getElementById('pwStatus').textContent='';
  const label = state.role==='admin' ? '管理者（admin）' : '病棟（ward）';
  document.getElementById('pwWho').textContent = `変更対象：今ログイン中の「${label}」アカウントのパスワードを変更します`;
  document.getElementById('pwModal').classList.add('show');
}
function closePwModal(){ document.getElementById('pwModal').classList.remove('show'); }
async function submitPwChange(){
  const p1 = document.getElementById('pw1').value;
  const p2 = document.getElementById('pw2').value;
  const st = document.getElementById('pwStatus');
  const btn = document.getElementById('pwSubmit');
  if(p1.length < 6){ st.style.color='#c0392b'; st.textContent='6文字以上で入力してください'; return; }
  if(p1 !== p2){ st.style.color='#c0392b'; st.textContent='確認用と一致しません'; return; }
  btn.disabled=true; st.style.color='var(--ink-soft)'; st.textContent='変更中…';
  try{
    const { error } = await sb.auth.updateUser({ password: p1 });
    if(error) throw error;
    st.style.color='var(--green)'; st.textContent='パスワードを変更しました。次回からは新しいパスワードでログインしてください';
    setTimeout(closePwModal, 1600);
  }catch(e){
    console.error(e);
    st.style.color='#c0392b'; st.textContent='変更できませんでした：'+(e.message||'もう一度お試しください');
  }finally{ btn.disabled=false; }
}

/* ---------------- タブ ---------------- */
function renderTabs(){
  const tabs = [{k:'browse',label:'資料を探す'}];
  if(state.role==='admin'){
    tabs.push({k:'manage',label:'資料を管理'});
    tabs.push({k:'stats',label:'活用状況'});
  }
  document.getElementById('tabs').innerHTML = tabs.map(t=>
    `<button class="tab ${state.nav===t.k?'active':''}" onclick="goTab('${t.k}')">${t.label}</button>`
  ).join('');
}
function goTab(k){
  state.nav=k; state.cat=null; state.sub=null; state.search='';
  renderTabs(); render();
}

/* ---------------- データ取得 ---------------- */
async function loadResources(){
  const { data, error } = await sb.from('library_resources').select('*').order('created_at',{ascending:false});
  if(error){ console.error(error); resources=[]; }
  else { resources = data || []; }
  render();
}

/* ---------------- 画面振り分け ---------------- */
function render(){
  const c = document.getElementById('content');
  if(state.nav==='manage'){ c.innerHTML = viewManage(); return; }
  if(state.nav==='stats'){ c.innerHTML = viewStats(); return; }
  c.innerHTML = viewBrowse();
}

/* ====================== 閲覧 ====================== */
function viewBrowse(){
  let html = `
    <div class="searchbar">
      <span class="ico">🔍</span>
      <input id="searchInput" placeholder="タイトル・タグで検索" value="${esc(state.search)}"
        oninput="onSearch(this.value)">
    </div>`;

  // 検索中
  if(state.search.trim()){
    const hits = resources.filter(r=> matchSearch(r, state.search));
    html += `<div class="crumbs"><span>「${esc(state.search)}」の検索結果：${hits.length}件</span></div>`;
    html += hits.length ? resListHtml(hits) : `<div class="empty">該当する資料がありません</div>`;
    return html;
  }

  // カテゴリー一覧
  if(!state.cat){
    html += `<div class="cat-grid">`;
    CATEGORIES.forEach(cat=>{
      const n = resources.filter(r=>r.category===cat.key).length;
      html += `
        <button class="cat-card ${cat.cls}" onclick="openCat('${cat.key}')">
          <span class="bar"></span>
          <div class="emoji">${cat.emoji}</div>
          <h3>${cat.key}</h3>
          <p>${cat.desc}</p>
          <div class="count">${n} 件の資料</div>
        </button>`;
    });
    html += `</div>`;
    return html;
  }

  // サブカテゴリー一覧
  if(!state.sub){
    const inCat = resources.filter(r=>r.category===state.cat);
    const subs = {};
    inCat.forEach(r=>{ const s=r.subcategory||'未分類'; subs[s]=(subs[s]||0)+1; });
    const keys = Object.keys(subs).sort();
    html = `
      <div class="searchbar"><span class="ico">🔍</span>
        <input id="searchInput" placeholder="タイトル・タグで検索" oninput="onSearch(this.value)"></div>
      <div class="crumbs"><a onclick="clearCat()">資料を探す</a><span>›</span><span>${esc(state.cat)}</span></div>`;
    if(!keys.length){ return html + `<div class="empty">この区分にはまだ資料がありません</div>`; }
    html += `<div class="sub-grid">`;
    keys.forEach(s=>{
      html += `<button class="sub-chip" onclick="openSub('${esc(s)}')">${esc(s)}<span class="n">${subs[s]}</span></button>`;
    });
    html += `</div>`;
    return html;
  }

  // 資料一覧
  const list = resources.filter(r=>r.category===state.cat && (r.subcategory||'未分類')===state.sub);
  html = `
    <div class="searchbar"><span class="ico">🔍</span>
      <input id="searchInput" placeholder="タイトル・タグで検索" oninput="onSearch(this.value)"></div>
    <div class="crumbs">
      <a onclick="clearCat()">資料を探す</a><span>›</span>
      <a onclick="clearSub()">${esc(state.cat)}</a><span>›</span>
      <span>${esc(state.sub)}</span>
    </div>`;
  html += list.length ? resListHtml(list) : `<div class="empty">資料がありません</div>`;
  return html;
}

function resListHtml(list){
  return `<div class="res-list">` + list.map(r=>{
    const tags = (r.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
    const yearBadge = r.year ? `<span class="tag" style="background:#eef0f2;color:#5b6b7b">${esc(r.year)}</span>` : '';
    return `
      <button class="res-item" onclick="openPdf('${r.id}')">
        <span class="pdf-ico">📄</span>
        <span class="meta">
          <span class="t">${esc(r.title)}</span>
          <span class="sub">${esc(r.category)}${r.subcategory?' ・ '+esc(r.subcategory):''}</span>
          <span class="tags">${yearBadge}${tags}</span>
        </span>
        <span class="stat">👍 <b>${r.likes}</b><br>閲覧 <b>${r.views}</b></span>
      </button>`;
  }).join('') + `</div>`;
}

function onSearch(v){ state.search=v; render(); restoreSearchFocus(); }
function restoreSearchFocus(){ const i=document.getElementById('searchInput'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} }
function matchSearch(r,q){
  const s=q.toLowerCase();
  return (r.title||'').toLowerCase().includes(s)
    || (r.subcategory||'').toLowerCase().includes(s)
    || (r.category||'').toLowerCase().includes(s)
    || (r.year||'').toLowerCase().includes(s)
    || (r.tags||[]).some(t=>t.toLowerCase().includes(s));
}
function openCat(k){ state.cat=k; state.sub=null; render(); }
function openSub(s){ state.sub=s; render(); }
function clearCat(){ state.cat=null; state.sub=null; render(); }
function clearSub(){ state.sub=null; render(); }

/* ====================== PDFプレビュー ====================== */
// 非公開バケット：ログイン中の人にだけ有効な一時URL（1時間）を発行
async function fileUrl(path){
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 3600);
  if(error){ console.error(error); return null; }
  return data.signedUrl;
}

async function openPdf(id){
  const r = resources.find(x=>x.id===id);
  if(!r) return;
  current = r;
  document.getElementById('pdfTitle').textContent = r.title;
  document.getElementById('viewCount').textContent = r.views;
  // 👍状態
  const liked = getLiked().includes(r.id);
  const lb = document.getElementById('likeBtn');
  lb.classList.toggle('liked', liked);
  document.getElementById('likeCount').textContent = r.likes;
  document.getElementById('pdfModal').classList.add('show');
  // 一時URLを取得して表示
  document.getElementById('pdfFrame').src = '';
  const url = await fileUrl(r.file_path);
  if(url){
    document.getElementById('pdfFrame').src = url;
    document.getElementById('dlLink').href = url;
  }

  // 閲覧カウント（このセッションで初回のみ）
  const viewed = JSON.parse(sessionStorage.getItem(viewedKey)||'[]');
  if(!viewed.includes(r.id)){
    viewed.push(r.id); sessionStorage.setItem(viewedKey, JSON.stringify(viewed));
    await sb.rpc('increment_view',{resource_id:r.id});
    r.views += 1;
    document.getElementById('viewCount').textContent = r.views;
  }
}
function closePdf(){
  document.getElementById('pdfModal').classList.remove('show');
  document.getElementById('pdfFrame').src='';
  current=null;
  render(); // 一覧の数字を更新
}
function getLiked(){ return JSON.parse(localStorage.getItem(likedKey)||'[]'); }
async function toggleLike(){
  if(!current) return;
  let liked = getLiked();
  const has = liked.includes(current.id);
  const delta = has ? -1 : 1;
  // UI即時反映
  if(has){ liked = liked.filter(x=>x!==current.id); }
  else { liked.push(current.id); }
  localStorage.setItem(likedKey, JSON.stringify(liked));
  current.likes = Math.max(0, current.likes + delta);
  document.getElementById('likeBtn').classList.toggle('liked', !has);
  document.getElementById('likeCount').textContent = current.likes;
  await sb.rpc('change_like',{resource_id:current.id, delta});
}

/* ====================== 管理：資料一覧＋追加 ====================== */
let editingId = null;

function viewManage(){
  let html = `
    <div class="panel">
      <h2>📤 資料を追加・管理</h2>
      <div style="display:flex;gap:10px;margin-bottom:18px">
        <button class="btn-add" onclick="openForm()">＋ 新しい資料を追加</button>
      </div>`;
  if(!resources.length){
    html += `<div class="empty">まだ資料がありません。「＋ 新しい資料を追加」から登録してください。</div></div>`;
    return html;
  }
  html += `<table class="admin"><thead><tr>
      <th>タイトル</th><th>区分</th><th>年度</th><th>タグ</th><th>閲覧</th><th>👍</th><th></th>
    </tr></thead><tbody>`;
  resources.forEach(r=>{
    const tags=(r.tags||[]).join('、');
    html += `<tr>
      <td><b>${esc(r.title)}</b></td>
      <td><span class="mini">${esc(r.category)}${r.subcategory?' / '+esc(r.subcategory):''}</span></td>
      <td><span class="mini">${esc(r.year||'—')}</span></td>
      <td><span class="mini">${esc(tags)}</span></td>
      <td>${r.views}</td>
      <td>${r.likes}</td>
      <td><div class="row-act">
        <button class="btn-edit" onclick="openForm('${r.id}')">編集</button>
        <button class="btn-del" onclick="delResource('${r.id}')">削除</button>
      </div></td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}

function openForm(id){
  editingId = id || null;
  document.getElementById('fCategory').innerHTML =
    CATEGORIES.map(c=>`<option value="${esc(c.key)}">${esc(c.key)}</option>`).join('');
  document.getElementById('formTitle').textContent = id ? '資料を編集' : '資料を追加';
  document.getElementById('formStatus').textContent='';
  const drop = document.getElementById('fileDrop');
  document.getElementById('fileInput').value='';
  if(id){
    const r = resources.find(x=>x.id===id);
    document.getElementById('fTitle').value = r.title;
    document.getElementById('fCategory').value = r.category;
    document.getElementById('fSub').value = r.subcategory||'';
    document.getElementById('fYear').value = r.year||'';
    document.getElementById('fTags').value = (r.tags||[]).join(', ');
    drop.textContent = '※ ファイルを変更しない場合はそのままでOK';
    drop.classList.remove('has');
    document.getElementById('fileHint').textContent='登録済みPDFを差し替えたい時だけ選択';
  } else {
    document.getElementById('fTitle').value='';
    document.getElementById('fSub').value='';
    document.getElementById('fYear').value='';
    document.getElementById('fTags').value='';
    drop.textContent='クリックしてPDFを選択（PDFのみ）';
    drop.classList.remove('has');
    document.getElementById('fileHint').textContent='';
  }
  refreshSubDatalist(); refreshTagDatalist(); refreshYearDatalist();
  document.getElementById('formModal').classList.add('show');
}
function closeForm(){ document.getElementById('formModal').classList.remove('show'); }
function onFilePick(){
  const f = document.getElementById('fileInput').files[0];
  const drop=document.getElementById('fileDrop');
  if(!f) return;
  if(f.type!=='application/pdf'){
    document.getElementById('fileHint').textContent='PDFファイルを選んでください';
    document.getElementById('fileInput').value=''; return;
  }
  drop.textContent='📄 '+f.name; drop.classList.add('has');
  document.getElementById('fileHint').textContent=(f.size/1024/1024).toFixed(1)+' MB';
}
function refreshSubDatalist(){
  const cat=document.getElementById('fCategory').value;
  const subs=[...new Set(resources.filter(r=>r.category===cat).map(r=>r.subcategory).filter(Boolean))];
  document.getElementById('subList').innerHTML = subs.map(s=>`<option value="${esc(s)}">`).join('');
}
function refreshTagDatalist(){
  const tags=[...new Set(resources.flatMap(r=>r.tags||[]))];
  document.getElementById('tagList').innerHTML = tags.map(t=>`<option value="${esc(t)}">`).join('');
}
function refreshYearDatalist(){
  // よく使う年度の候補 ＋ 既存資料で使われている年度
  const base=['令和8年度','令和7年度','令和6年度','令和5年度','令和4年度'];
  const used=resources.map(r=>r.year).filter(Boolean);
  const years=[...new Set([...used, ...base])];
  document.getElementById('yearList').innerHTML = years.map(y=>`<option value="${esc(y)}">`).join('');
}

async function submitForm(){
  const title=document.getElementById('fTitle').value.trim();
  const category=document.getElementById('fCategory').value;
  const sub=document.getElementById('fSub').value.trim();
  const year=document.getElementById('fYear').value.trim();
  const tags=document.getElementById('fTags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const file=document.getElementById('fileInput').files[0];
  const status=document.getElementById('formStatus');
  const btn=document.getElementById('formSubmit');

  if(!title){ status.style.color='#c0392b'; status.textContent='タイトルを入力してください'; return; }
  if(!editingId && !file){ status.style.color='#c0392b'; status.textContent='PDFファイルを選択してください'; return; }

  btn.disabled=true; status.style.color='var(--ink-soft)'; status.textContent='保存中…';
  try{
    let filePath = null;
    if(file){
      const safe = file.name.replace(/[^\w.\-]/g,'_');
      filePath = `${category}/${Date.now()}_${safe}`;
      const { error:upErr } = await sb.storage.from(BUCKET).upload(filePath, file, {contentType:'application/pdf'});
      if(upErr) throw upErr;
    }
    if(editingId){
      const patch={ title, category, subcategory:sub, year, tags, updated_at:new Date().toISOString() };
      if(filePath) patch.file_path=filePath;
      const { error } = await sb.from('library_resources').update(patch).eq('id',editingId);
      if(error) throw error;
    } else {
      const { error } = await sb.from('library_resources').insert({ title, category, subcategory:sub, year, tags, file_path:filePath });
      if(error) throw error;
    }
    status.style.color='var(--green)'; status.textContent='保存しました';
    await loadResources();
    setTimeout(closeForm,500);
  }catch(e){
    console.error(e);
    status.style.color='#c0392b'; status.textContent='エラー：'+(e.message||'保存に失敗しました');
  }finally{ btn.disabled=false; }
}

async function delResource(id){
  const r=resources.find(x=>x.id===id);
  if(!r) return;
  if(!confirm(`「${r.title}」を削除します。よろしいですか？`)) return;
  try{
    if(r.file_path) await sb.storage.from(BUCKET).remove([r.file_path]);
    const { error } = await sb.from('library_resources').delete().eq('id',id);
    if(error) throw error;
    await loadResources();
  }catch(e){ console.error(e); alert('削除に失敗しました：'+(e.message||'')); }
}

/* ====================== 活用状況（集計） ====================== */
function viewStats(){
  if(!resources.length){
    return `<div class="panel"><h2>📊 活用状況</h2><div class="empty">資料が登録されると、ここに活用状況が表示されます。</div></div>`;
  }
  const total = resources.length;
  const unviewed = resources.filter(r=>r.views===0).length;          // 死蔵候補（一度も開かれていない）
  const totalViews = resources.reduce((s,r)=>s+r.views,0);
  // カテゴリー別の登録件数（分野の偏りを把握）
  const catCounts = CATEGORIES.map(c=>({ ...c, n:resources.filter(r=>r.category===c.key).length }));
  const maxN = Math.max(1, ...catCounts.map(c=>c.n));

  // ① 登録状況サマリー（偏り・死蔵の把握）
  let html=`<div class="panel"><h2>🗂 登録状況</h2>
    <div class="stat-cards">
      <div class="stat-card"><div class="num">${total}</div><div class="lbl">登録資料</div></div>
      <div class="stat-card"><div class="num">${totalViews}</div><div class="lbl">のべ閲覧数</div></div>
      <div class="stat-card ${unviewed>0?'warn':''}"><div class="num">${unviewed}</div><div class="lbl">未閲覧（死蔵候補）</div></div>
    </div>
    <div class="sort-note" style="margin:16px 0 8px">カテゴリー別の登録件数 ― 件数の少ない分野は資料が手薄かもしれません</div>
    <div class="cat-bars">`;
  catCounts.forEach(c=>{
    const w = Math.round(c.n / maxN * 100);
    html+=`<div class="cat-bar-row">
        <span class="cb-name">${c.emoji} ${esc(c.key)}</span>
        <span class="cb-track"><span class="cb-fill ${c.cls}" style="width:${c.n?Math.max(w,6):0}%"></span></span>
        <span class="cb-n">${c.n}</span>
      </div>`;
  });
  html+=`</div></div>`;

  // ② 資料ごとの活用状況テーブル
  const rows=[...resources].sort((a,b)=>b.views-a.views);
  html+=`<div class="panel"><h2>📊 活用状況 ― 資料の見直しに</h2>
    <div class="sort-note">閲覧数が多い順。👍率＝役に立った数 ÷ 閲覧数。最終更新日が古い資料は内容の確認を。</div>
    <table class="admin"><thead><tr>
      <th>タイトル</th><th>区分</th><th>年度</th><th>最終更新</th><th>閲覧</th><th>👍</th><th>👍率</th><th>仕分けの目安</th>
    </tr></thead><tbody>`;
  rows.forEach(r=>{
    const rate = r.views>0 ? Math.round(r.likes/r.views*100) : 0;
    const j = judge(r, rate);
    html+=`<tr>
      <td><b>${esc(r.title)}</b></td>
      <td><span class="mini">${esc(r.category)}${r.subcategory?' / '+esc(r.subcategory):''}</span></td>
      <td><span class="mini">${esc(r.year||'—')}</span></td>
      <td><span class="mini">${fmtDate(r.updated_at)}</span></td>
      <td>${r.views}</td><td>${r.likes}</td>
      <td>${r.views>0?rate+'%':'—'}</td>
      <td><span class="pill ${j.cls}">${j.label}</span></td>
    </tr>`;
  });
  html+=`</tbody></table>
    <div class="sort-note" style="margin-top:14px;line-height:1.9">
      <b>仕分けの目安</b>　
      <span class="pill good">良資料</span> よく見られ評価も高い／維持　
      <span class="pill fix">要修正</span> よく見られるが評価が低い／内容を見直し　
      <span class="pill bury">導線改善</span> 評価は高いが見られていない／周知・分類を見直し　
      <span class="pill low">整理検討</span> 見られず評価も少ない／統合・廃棄を検討
    </div></div>`;
  return html;
}
function fmtDate(s){
  if(!s) return '—';
  const d = new Date(s);
  if(isNaN(d)) return '—';
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}
function judge(r, rate){
  const viewed = r.views >= 5;        // 「見られている」目安（運用しながら調整可）
  const liked  = rate >= 40;          // 「役に立っている」目安
  if(viewed && liked)  return {cls:'good', label:'良資料'};
  if(viewed && !liked) return {cls:'fix',  label:'要修正'};
  if(!viewed && r.likes>0 && liked) return {cls:'bury', label:'導線改善'};
  return {cls:'low', label:'整理検討'};
}

/* ---------------- ユーティリティ ---------------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
</script>
