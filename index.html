<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICU資料ライブラリ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
  // PDF.js のワーカー設定（タブレットでの表示用）
  if(window.pdfjsLib){
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     ▼▼▼ ① ここに Supabase の接続情報を貼ってください ▼▼▼
     STAT/VENT の index.html の先頭にある SUPABASE_URL と
     SUPABASE_ANON_KEY を、そのままコピーして下の JS（②）に貼ります。
     （このコメントは目印。実際の貼り付け場所は下の <script> 内）
     ============================================================ */

  :root{
    --bg:#f4f6f8; --surface:#ffffff; --ink:#1b2733; --ink-soft:#5b6b7b;
    --line:#e2e8ef; --teal:#0d8a8a; --teal-deep:#0a6b6b; --teal-soft:#e6f4f4;
    --blue:#2b6cb0; --green:#2f855a; --amber:#c05621;
    --shadow:0 1px 3px rgba(20,40,60,.08),0 6px 20px rgba(20,40,60,.06);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;line-height:1.6;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit;font-size:15px}

  /* ---------- ログイン ---------- */
  #login{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#0a6b6b,#0d8a8a 60%,#13a0a0);padding:20px;
  }
  .login-card{
    background:var(--surface);border-radius:20px;padding:40px 34px;width:100%;max-width:380px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:center;
  }
  .login-card .logo{font-size:34px}
  .login-card h1{font-size:21px;margin:10px 0 4px;letter-spacing:.02em}
  .login-card p{color:var(--ink-soft);font-size:13px;margin-bottom:24px}
  .field{text-align:left;margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px}
  .field input{
    width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;
    transition:border-color .15s;
  }
  .field input:focus{outline:none;border-color:var(--teal)}
  .btn-primary{
    width:100%;background:var(--teal);color:#fff;font-weight:700;padding:13px;
    border-radius:10px;font-size:15px;transition:background .15s;margin-top:6px;
  }
  .btn-primary:hover{background:var(--teal-deep)}
  .login-err{color:#c0392b;font-size:13px;min-height:18px;margin-top:10px}

  /* ---------- アプリ枠 ---------- */
  #app{display:none;min-height:100vh}
  header.topbar{
    background:var(--surface);border-bottom:1px solid var(--line);
    padding:0 20px;display:flex;align-items:center;gap:18px;height:60px;
    position:sticky;top:0;z-index:30;
  }
  .brand{font-weight:900;font-size:18px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
  .brand .dot{color:var(--teal)}
  .tabs{display:flex;gap:4px;margin-left:8px}
  .tab{
    padding:8px 16px;border-radius:9px;font-weight:700;font-size:14px;color:var(--ink-soft);
  }
  .tab.active{background:var(--teal-soft);color:var(--teal-deep)}
  .spacer{flex:1}
  .who{font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:10px}
  .who .role{background:var(--teal-soft);color:var(--teal-deep);padding:3px 10px;border-radius:20px;font-weight:700;font-size:12px}
  .logout{font-size:13px;color:var(--ink-soft);text-decoration:underline}
  .adminbtn{font-size:12px;font-weight:700;color:var(--teal-deep);background:var(--teal-soft);padding:5px 13px;border-radius:20px;white-space:nowrap}
  .adminbtn:hover{background:#d5ecec}

  main{max-width:1080px;margin:0 auto;padding:24px 20px 60px}

  /* ---------- 検索バー ---------- */
  .searchbar{position:relative;margin-bottom:22px}
  .searchbar input{
    width:100%;padding:13px 16px 13px 44px;border:1.5px solid var(--line);
    border-radius:12px;background:var(--surface);box-shadow:var(--shadow);
  }
  .searchbar input:focus{outline:none;border-color:var(--teal)}
  .searchbar .ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--ink-soft)}

  /* ---------- パンくず ---------- */
  .crumbs{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:18px;flex-wrap:wrap}
  .crumbs a{color:var(--teal-deep);font-weight:700;text-decoration:none;cursor:pointer}
  .crumbs span{color:var(--ink-soft)}

  /* ---------- カテゴリーカード ---------- */
  /* iPad13(横/縦)で全項目を見渡せるよう、アイコンは現状の30pxを維持しつつタイル幅をコンパクトに */
  .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(192px,1fr));gap:14px}
  .cat-card{
    background:var(--surface);border-radius:var(--radius);padding:20px 18px;box-shadow:var(--shadow);
    border:1px solid var(--line);text-align:left;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden;
  }
  .cat-card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(20,40,60,.12)}
  .cat-card .emoji{font-size:30px;line-height:1}
  .cat-card h3{font-size:18px;margin:9px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cat-card p{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cat-card .bar{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--bar,#0d8a8a)}
  .cat-card .count{margin-top:10px;font-size:12px;color:var(--ink-soft);font-weight:700;white-space:nowrap}
  .c-1{--bar:#d64545}  .c-2{--bar:#7c5cbf}  .c-3{--bar:#0d8a8a}  .c-4{--bar:#e0719c}
  .c-5{--bar:#b3242b}  .c-6{--bar:#4a6fa5}  .c-7{--bar:#2f855a}  .c-8{--bar:#2b6cb0}
  .c-9{--bar:#c05621}  .c-10{--bar:#9c6b3f} .c-11{--bar:#5b8a8a} .c-12{--bar:#607080}
  .c-13{--bar:#d98a1f} .c-14{--bar:#3d8ea3}

  /* ---------- サブカテゴリーチップ ---------- */
  .sub-grid{display:flex;flex-wrap:wrap;gap:10px}
  .sub-chip{
    background:var(--surface);border:1.5px solid var(--line);border-radius:30px;
    padding:10px 20px;font-weight:700;font-size:15px;box-shadow:var(--shadow);transition:.15s;white-space:nowrap;
  }
  .sub-chip:hover{border-color:var(--teal);color:var(--teal-deep)}
  .sub-chip .n{color:var(--ink-soft);font-weight:500;font-size:13px;margin-left:6px}

  /* ---------- 資料リスト ---------- */
  .res-list{display:flex;flex-direction:column;gap:10px}
  .res-item{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;
    box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;transition:.15s;text-align:left;width:100%;
  }
  .res-item:hover{border-color:var(--teal);transform:translateX(2px)}
  .res-item .pdf-ico{font-size:24px;flex-shrink:0}
  .res-item .meta{flex:1;min-width:0}
  .res-item .meta .t{font-weight:700;font-size:16px;margin-bottom:3px}
  .res-item .meta .sub{font-size:12px;color:var(--ink-soft)}
  .res-item .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
  .tag{background:var(--teal-soft);color:var(--teal-deep);font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
  .res-item .stat{font-size:12px;color:var(--ink-soft);text-align:right;flex-shrink:0;line-height:1.7}
  .res-item .stat b{color:var(--ink)}

  .empty{text-align:center;color:var(--ink-soft);padding:50px 20px;font-size:15px}

  /* ---------- PDFモーダル ---------- */
  .modal-bg{
    display:none;position:fixed;inset:0;background:rgba(10,30,40,.55);z-index:100;
    align-items:center;justify-content:center;padding:20px;
  }
  .modal-bg.show{display:flex}
  .pdf-modal{
    background:var(--surface);border-radius:16px;width:100%;max-width:900px;height:90vh;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .pdf-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}
  .pdf-head .t{font-weight:700;font-size:17px;flex:1;min-width:0}
  .pdf-head .x{font-size:22px;color:var(--ink-soft);padding:4px 8px}
  .pdf-view{flex:1;position:relative;overflow:auto;background:#525659;display:flex;justify-content:center;align-items:center;padding:16px;-webkit-overflow-scrolling:touch}
  .pdf-view canvas{max-width:100%;height:auto;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.35);border-radius:4px}
  .pdf-loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:14px}
  .pdf-nav{display:flex;align-items:center;justify-content:center;gap:18px;padding:10px 20px;border-top:1px solid var(--line);background:var(--surface)}
  .pg-btn{background:var(--teal-deep);color:#fff;border:none;border-radius:30px;padding:11px 24px;font-weight:700;font-size:15px;cursor:pointer}
  .pg-btn:disabled{opacity:.35;cursor:default}
  .pg-ind{font-size:15px;font-weight:700;color:var(--ink);min-width:64px;text-align:center}
  .pdf-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .like-btn{
    display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);
    border-radius:30px;padding:9px 18px;font-weight:700;font-size:15px;transition:.15s;color:var(--ink);white-space:nowrap;
  }
  .like-btn:hover{border-color:var(--teal)}
  .like-btn.liked{background:#fff4e6;border-color:var(--amber);color:var(--amber)}
  .pdf-foot .views{font-size:13px;color:var(--ink-soft)}
  .pdf-foot .dl{margin-left:auto;font-size:14px;color:var(--teal-deep);font-weight:700;text-decoration:none}

  /* ---------- 管理画面 ---------- */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:22px}
  .panel h2{font-size:17px;margin-bottom:18px;display:flex;align-items:center;gap:8px}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  .form-row.full{grid-template-columns:1fr}
  .form-group label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px}
  .form-group input,.form-group select{
    width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;background:#fff;
  }
  .form-group input:focus,.form-group select:focus{outline:none;border-color:var(--teal)}
  .hint{font-size:11px;color:var(--ink-soft);margin-top:4px}
  .file-drop{
    border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--ink-soft);
    cursor:pointer;transition:.15s;
  }
  .file-drop:hover{border-color:var(--teal);background:var(--teal-soft)}
  .file-drop.has{border-color:var(--teal);color:var(--teal-deep);background:var(--teal-soft);font-weight:700}
  .upload-status{font-size:13px;margin-top:10px;min-height:18px}

  table.admin{width:100%;border-collapse:collapse;font-size:14px}
  table.admin th,table.admin td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
  table.admin th{font-size:12px;color:var(--ink-soft);font-weight:700;text-transform:none}
  table.admin td .mini{font-size:12px;color:var(--ink-soft)}
  .pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
  .pill.good{background:#e6f6ec;color:#2f855a}
  .pill.fix{background:#fdecea;color:#c0392b}
  .pill.bury{background:#fef5e7;color:#c05621}
  .pill.low{background:#eef0f2;color:#5b6b7b}
  .row-act{display:flex;gap:8px}
  .row-act button{font-size:12px;font-weight:700;padding:5px 11px;border-radius:7px}
  .btn-edit{background:var(--teal-soft);color:var(--teal-deep)}
  .btn-del{background:#fdecea;color:#c0392b}
  .btn-add{background:var(--teal);color:#fff;font-weight:700;padding:11px 22px;border-radius:9px}
  .btn-ghost{background:#eef0f2;color:var(--ink);font-weight:700;padding:11px 22px;border-radius:9px}
  .sort-note{font-size:12px;color:var(--ink-soft);margin-bottom:10px}

  @media(max-width:620px){
    .form-row{grid-template-columns:1fr}
    .tabs .tab{padding:8px 11px;font-size:13px}
    .brand{font-size:16px}
    main{padding:18px 14px 50px}
    .res-item .stat{display:none}
  }
</style>
</head>
<body>

<!-- ===================== ログイン ===================== -->
<div id="login">
  <div class="login-card">
    <div class="logo">📚</div>
    <h1>ICU資料ライブラリ</h1>
    <p>パスワードを入力してください</p>
    <div class="field">
      <label>パスワード</label>
      <input id="loginPw" type="password" autocomplete="current-password" placeholder="パスワード">
    </div>
    <button class="btn-primary" onclick="doLogin()">ログイン</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- ===================== アプリ本体 ===================== -->
<div id="app">
  <header class="topbar">
    <div class="brand">📚 ICU資料ライブラリ<span class="dot">.</span></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="spacer"></div>
    <div class="who">
      <span class="role" id="roleLabel"></span>
      <button class="adminbtn" id="adminBtn" onclick="openAdminPrompt()">管理者</button>
      <a class="logout" onclick="doLogout()">ログアウト</a>
    </div>
  </header>
  <main id="content"></main>
</div>

<!-- ===================== PDFプレビュー モーダル ===================== -->
<div class="modal-bg" id="pdfModal">
  <div class="pdf-modal">
    <div class="pdf-head">
      <span class="t" id="pdfTitle"></span>
      <button class="x" onclick="closePdf()">✕</button>
    </div>
    <div class="pdf-view" id="pdfView">
      <div class="pdf-loading" id="pdfLoading">読み込み中…</div>
      <canvas id="pdfCanvas"></canvas>
    </div>
    <div class="pdf-nav">
      <button class="pg-btn" id="prevBtn" onclick="prevPage()">◀ 前</button>
      <span class="pg-ind"><b id="pgCur">-</b> / <span id="pgTotal">-</span></span>
      <button class="pg-btn" id="nextBtn" onclick="nextPage()">次 ▶</button>
    </div>
    <div class="pdf-foot">
      <button class="like-btn" id="likeBtn" onclick="toggleLike()">👍 役に立った <span id="likeCount">0</span></button>
      <span class="views">閲覧 <b id="viewCount">0</b> 回</span>
      <a class="dl" id="dlLink" href="#" target="_blank" rel="noopener">⬇ ダウンロード</a>
    </div>
  </div>
</div>

<!-- ===================== アップロード/編集 モーダル ===================== -->
<div class="modal-bg" id="formModal">
  <div class="pdf-modal" style="max-width:560px;height:auto;max-height:92vh;overflow:auto">
    <div class="pdf-head">
      <span class="t" id="formTitle">資料を追加</span>
      <button class="x" onclick="closeForm()">✕</button>
    </div>
    <div style="padding:22px">
      <div class="form-group" style="margin-bottom:14px">
        <label>PDFファイル</label>
        <div class="file-drop" id="fileDrop" onclick="document.getElementById('fileInput').click()">
          クリックしてPDFを選択（PDFのみ）
        </div>
        <input type="file" id="fileInput" accept="application/pdf" style="display:none" onchange="onFilePick()">
        <div class="hint" id="fileHint"></div>
      </div>
      <div class="form-group" style="margin-bottom:14px">
        <label>タイトル</label>
        <input id="fTitle" type="text" placeholder="例）小児の人工呼吸器設定の基本">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>大カテゴリー</label>
          <select id="fCategory" onchange="refreshSubDatalist()"></select>
        </div>
        <div class="form-group">
          <label>サブカテゴリー</label>
          <input id="fSub" list="subList" placeholder="例）小児 / 心臓 / 面会">
          <datalist id="subList"></datalist>
          <div class="hint">既存の候補から選ぶと表記が揃います</div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>年度</label>
          <input id="fYear" list="yearList" placeholder="例）令和8年度">
          <datalist id="yearList"></datalist>
          <div class="hint">資料の版（改訂年度）の目印に</div>
        </div>
        <div class="form-group">
          <label>タグ（カンマ区切り・任意）</label>
          <input id="fTags" list="tagList" placeholder="例）人工呼吸器, 新生児">
          <datalist id="tagList"></datalist>
        </div>
      </div>
      <div class="upload-status" id="formStatus"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn-ghost" onclick="closeForm()">キャンセル</button>
        <button class="btn-add" id="formSubmit" onclick="submitForm()">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- ===================== 管理者モード切替 モーダル ===================== -->
<div class="modal-bg" id="adminModal">
  <div class="pdf-modal" style="max-width:380px;height:auto;max-height:92vh;overflow:auto">
    <div class="pdf-head">
      <span class="t">管理者モードに切り替え</span>
      <button class="x" onclick="closeAdminPrompt()">✕</button>
    </div>
    <div style="padding:22px">
      <div class="form-group" style="margin-bottom:14px">
        <label>管理者パスワード</label>
        <input id="adminPw" type="password" autocomplete="off" placeholder="管理者パスワード">
      </div>
      <div class="upload-status" id="adminErr"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn-ghost" onclick="closeAdminPrompt()">キャンセル</button>
        <button class="btn-add" id="adminSubmit" onclick="submitAdmin()">管理者モードにする</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   ② ここに Supabase の接続情報を貼ってください
   STAT/VENT の index.html 先頭にある2つの値をコピペしてください。
   ============================================================ */
const SUPABASE_URL      = 'https://qepfuorcodwenxzadbts.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFlcGZ1b3Jjb2R3ZW54emFkYnRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NjE3MzIsImV4cCI6MjA5NTQzNzczMn0.woYxAkG8q4mgfeuHrGo5OpbuQioV-9QiQoI1uQFMwi8';

/* ============================================================
   ③ ログインは Supabase Auth で管理します（ソースにパスワードは持ちません）
      ・管理者アカウント： admin@icu.local
      ・病棟アカウント　： ward@icu.local
      ログイン画面では「admin」「ward」だけ入力すればOK（内部で@icu.localを付与）
   ============================================================ */
const ADMIN_EMAIL  = 'admin@icu.local';   // このアカウントだけ管理者扱い
const WARD_EMAIL   = 'ward@icu.local';    // 全員共通の閲覧用（パスワードのみログイン）
const EMAIL_DOMAIN = '@icu.local';        // （旧）ID → メール変換用
/* ============================================================ */

const CATEGORIES = [
  { key:'循環器・心臓', cls:'c-1',  emoji:'🫀', desc:'心臓・循環の管理' },
  { key:'脳神経・脳',   cls:'c-2',  emoji:'🧠', desc:'脳・神経の管理' },
  { key:'呼吸器',       cls:'c-3',  emoji:'🫁', desc:'呼吸・人工呼吸 管理' },
  { key:'小児',         cls:'c-4',  emoji:'👶', desc:'小児・新生児' },
  { key:'輸血関連',     cls:'c-5',  emoji:'🩸', desc:'輸血・血液製剤' },
  { key:'医療機器',     cls:'c-6',  emoji:'🖥️', desc:'機器の取扱い・設定' },

  { key:'腎臓・透析',   cls:'c-8',  emoji:'💧', desc:'腎・透析/CRRT' },

/* ---------------- 大項目の並び順（使用頻度＝閲覧数の合計が多い順） ----------------
   ・業務／困ったとき は常に末尾固定（よく探す位置が動かないように）
   ・それ以外（ベッドサイドファイル含む）は閲覧数の合計が多い順に自動で並ぶ
   ・閲覧数が同じ（0件含む）ときは CATEGORIES の元の順を保つ＝安定
   ※ベッドサイドファイルも固定したくなったら下の配列に 'ベッドサイドファイル' を足すだけ */
const PINNED_BOTTOM = ['業務','困ったとき'];
function categoryViews(catKey){
  return resources.filter(r=>r.category===catKey).reduce((s,r)=>s+(r.views||0),0);
}
function orderedCategories(){
  const idx = new Map(CATEGORIES.map((c,i)=>[c.key,i]));
  const main   = CATEGORIES.filter(c=>!PINNED_BOTTOM.includes(c.key));
  const pinned = CATEGORIES.filter(c=> PINNED_BOTTOM.includes(c.key));
  main.sort((a,b)=>{
    const va=categoryViews(a.key), vb=categoryViews(b.key);
    if(vb!==va) return vb-va;             // 閲覧数の多い順
    return idx.get(a.key)-idx.get(b.key); // 同数は元の順で安定
  });
  pinned.sort((a,b)=>idx.get(a.key)-idx.get(b.key)); // 業務→困ったとき の順を維持
  return [...main, ...pinned];
}

function viewBrowse(){
  let html = `
    <div class="searchbar">
      <span class="ico">🔍</span>
      <input id="searchInput" placeholder="タイトル・タグで検索" value="${esc(state.search)}"
        oninput="onSearch(this.value)">
    </div>`;

  // 検索中
  if(state.search.trim()){
    const hits = resources.filter(r=> matchSearch(r, state.search));
    html += `<div class="crumbs"><span>「${esc(state.search)}」の検索結果：${hits.length}件</span></div>`;
    html += hits.length ? resListHtml(hits) : `<div class="empty">該当する資料がありません</div>`;
    return html;
  }

  // カテゴリー一覧
  if(!state.cat){
    html += `<div class="cat-grid">`;
    orderedCategories().forEach(cat=>{
      const n = resources.filter(r=>r.category===cat.key).length;
      html += `
        <button class="cat-card ${cat.cls}" onclick="openCat('${cat.key}')">
          <span class="bar"></span>
          <div class="emoji">${cat.emoji}</div>
          <h3>${cat.key}</h3>
          <p>${cat.desc}</p>
          <div class="count">${n} 件の資料</div>
        </button>`;
    });
    html += `</div>`;
    return html;
  }

  // サブカテゴリー一覧
  if(!state.sub){
    const inCat = resources.filter(r=>r.category===state.cat);
    const subs = {};
    inCat.forEach(r=>{ const s=r.subcategory||'未分類'; subs[s]=(subs[s]||0)+1; });
    const keys = Object.keys(subs).sort();
    html = `
      <div class="searchbar"><span class="ico">🔍</span>
        <input id="searchInput" placeholder="タイトル・タグで検索" oninput="onSearch(this.value)"></div>
      <div class="crumbs"><a onclick="clearCat()">資料を探す</a><span>›</span><span>${esc(state.cat)}</span></div>`;
    if(!keys.length){ return html + `<div class="empty">この区分にはまだ資料がありません</div>`; }
    html += `<div class="sub-grid">`;
    keys.forEach(s=>{
      html += `<button class="sub-chip" onclick="openSub('${esc(s)}')">${esc(s)}<span class="n">${subs[s]}</span></button>`;
    });
    html += `</div>`;
    return html;
  }

  // 資料一覧
  const list = resources.filter(r=>r.category===state.cat && (r.subcategory||'未分類')===state.sub);
  html = `
    <div class="searchbar"><span class="ico">🔍</span>
      <input id="searchInput" placeholder="タイトル・タグで検索" oninput="onSearch(this.value)"></div>
    <div class="crumbs">
      <a onclick="clearCat()">資料を探す</a><span>›</span>
      <a onclick="clearSub()">${esc(state.cat)}</a><span>›</span>
      <span>${esc(state.sub)}</span>
    </div>`;
  html += list.length ? resListHtml(list) : `<div class="empty">資料がありません</div>`;
  return html;
}

function resListHtml(list){
  return `<div class="res-list">` + list.map(r=>{
    const tags = (r.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
    const yearBadge = r.year ? `<span class="tag" style="background:#eef0f2;color:#5b6b7b">${esc(r.year)}</span>` : '';
    return `
      <button class="res-item" onclick="openPdf('${r.id}')">
        <span class="pdf-ico">📄</span>
        <span class="meta">
          <span class="t">${esc(r.title)}</span>
          <span class="sub">${esc(r.category)}${r.subcategory?' ・ '+esc(r.subcategory):''}</span>
          <span class="tags">${yearBadge}${tags}</span>
        </span>
        <span class="stat">👍 <b>${r.likes}</b><br>閲覧 <b>${r.views}</b></span>
      </button>`;
  }).join('') + `</div>`;
}

function onSearch(v){ state.search=v; render(); restoreSearchFocus(); }
function restoreSearchFocus(){ const i=document.getElementById('searchInput'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} }
function matchSearch(r,q){
  const s=q.toLowerCase();
  return (r.title||'').toLowerCase().includes(s)
    || (r.subcategory||'').toLowerCase().includes(s)
    || (r.category||'').toLowerCase().includes(s)
    || (r.year||'').toLowerCase().includes(s)
    || (r.tags||[]).some(t=>t.toLowerCase().includes(s));
}

// 非公開バケット：ログイン中の人にだけ有効な一時URL（1時間）を発行
async function fileUrl(path){
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 3600);
  if(error){ console.error(error); return null; }
  return data.signedUrl;
}

let pdfDoc=null, pdfPage=1, pdfRendering=false, pdfPending=null;

async function openPdf(id){
  const r = resources.find(x=>x.id===id);
  if(!r) return;
  current = r;
  document.getElementById('pdfTitle').textContent = r.title;
  document.getElementById('viewCount').textContent = r.views;
  // 👍状態
  const liked = getLiked().includes(r.id);
  const lb = document.getElementById('likeBtn');
  lb.classList.toggle('liked', liked);
  document.getElementById('likeCount').textContent = r.likes;
  document.getElementById('pdfModal').classList.add('show');

  // ビューア初期化
  if(pdfDoc){ try{pdfDoc.destroy();}catch(e){} }
  pdfDoc=null; pdfPage=1; pdfPending=null;
  document.getElementById('pgCur').textContent='-';
  document.getElementById('pgTotal').textContent='-';
  document.getElementById('prevBtn').disabled=true;
  document.getElementById('nextBtn').disabled=true;
  const loading=document.getElementById('pdfLoading');
  loading.style.display='block'; loading.textContent='読み込み中…';

  // 一時URLを取得してPDF.jsで描画
  const url = await fileUrl(r.file_path);
  if(url){
    document.getElementById('dlLink').href = url;
    try{
      pdfDoc = await pdfjsLib.getDocument(url).promise;
      document.getElementById('pgTotal').textContent = pdfDoc.numPages;
      await renderPdfPage(1);
    }catch(e){
      console.error(e);
      loading.textContent='PDFを表示できませんでした';
    }
  }else{
    loading.textContent='PDFを表示できませんでした';
  }

  // 閲覧カウント（このセッションで初回のみ）
  const viewed = JSON.parse(sessionStorage.getItem(viewedKey)||'[]');
  if(!viewed.includes(r.id)){
    viewed.push(r.id); sessionStorage.setItem(viewedKey, JSON.stringify(viewed));
    await sb.rpc('increment_view',{resource_id:r.id});
    r.views += 1;
    document.getElementById('viewCount').textContent = r.views;
  }
}

async function renderPdfPage(n){
  if(!pdfDoc) return;
  if(pdfRendering){ pdfPending=n; return; }   // 連打対策：描画中は最後の指定だけ後で処理
  pdfRendering=true;
  try{
    const page = await pdfDoc.getPage(n);
    const view = document.getElementById('pdfView');
    const cv = document.getElementById('pdfCanvas');
    const ctx = cv.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const availW = Math.max(200, view.clientWidth  - 32); // 余白分を引いた表示可能幅
    const availH = Math.max(200, view.clientHeight - 32); // 余白分を引いた表示可能高さ
    const base = page.getViewport({scale:1});
    const scale = Math.min(availW / base.width, availH / base.height); // 縦横とも収まる倍率
    const vp = page.getViewport({scale: scale * dpr});  // 高精細描画
    cv.width = vp.width; cv.height = vp.height;
    cv.style.width = (vp.width/dpr)+'px';
    cv.style.height = (vp.height/dpr)+'px';
    await page.render({canvasContext:ctx, viewport:vp}).promise;
    document.getElementById('pdfLoading').style.display='none';
    pdfPage = n;
    document.getElementById('pgCur').textContent = n;
    document.getElementById('prevBtn').disabled = (n<=1);
    document.getElementById('nextBtn').disabled = (n>=pdfDoc.numPages);
    view.scrollTop = 0;
  }catch(e){ console.error(e); }
  pdfRendering=false;
  if(pdfPending!==null){ const p=pdfPending; pdfPending=null; renderPdfPage(p); }
}

function prevPage(){ if(pdfDoc && pdfPage>1) renderPdfPage(pdfPage-1); }
function nextPage(){ if(pdfDoc && pdfPage<pdfDoc.numPages) renderPdfPage(pdfPage+1); }

// タブレットの回転・画面リサイズ時は現在ページを再描画してフィットさせる

function getLiked(){ return JSON.parse(localStorage.getItem(likedKey)||'[]'); }
async function toggleLike(){
  if(!current) return;
  let liked = getLiked();
  const has = liked.includes(current.id);
  const delta = has ? -1 : 1;
  // UI即時反映
  if(has){ liked = liked.filter(x=>x!==current.id); }
  else { liked.push(current.id); }
  localStorage.setItem(likedKey, JSON.stringify(liked));
  current.likes = Math.max(0, current.likes + delta);
  document.getElementById('likeBtn').classList.toggle('liked', !has);
  document.getElementById('likeCount').textContent = current.likes;
  await sb.rpc('change_like',{resource_id:current.id, delta});
}

  const btn=document.getElementById('formSubmit');

  if(!title){ status.style.color='#c0392b'; status.textContent='タイトルを入力してください'; return; }
  if(!editingId && !file){ status.style.color='#c0392b'; status.textContent='PDFファイルを選択してください'; return; }

  btn.disabled=true; status.style.color='var(--ink-soft)'; status.textContent='保存中…';
  try{
    let filePath = null;
    if(file){
      const safe = file.name.replace(/[^\w.\-]/g,'_');
      // ストレージのキーに日本語（中黒「・」など）は使えないため、カテゴリーはパスに含めず
      // ASCIIのみの安全なキー（タイムスタンプ_ファイル名）にする
      filePath = `${Date.now()}_${safe}`;
      const { error:upErr } = await sb.storage.from(BUCKET).upload(filePath, file, {contentType:'application/pdf'});
      if(upErr) throw upErr;
    }
    if(editingId){
      const patch={ title, category, subcategory:sub, year, tags, updated_at:new Date().toISOString() };
      if(filePath) patch.file_path=filePath;
      const { error } = await sb.from('library_resources').update(patch).eq('id',editingId);
      if(error) throw error;
    } else {
      const { error } = await sb.from('library_resources').insert({ title, category, subcategory:sub, year, tags, file_path:filePath });
      if(error) throw error;
    }
    status.style.color='var(--green)'; status.textContent='保存しました';
    await loadResources();
    setTimeout(closeForm,500);
  }catch(e){
    console.error(e);
    status.style.color='#c0392b'; status.textContent='エラー：'+(e.message||'保存に失敗しました');
  }finally{ btn.disabled=false; }
}

async function delResource(id){
  const r=resources.find(x=>x.id===id);
  if(!r) return;
  if(!confirm(`「${r.title}」を削除します。よろしいですか？`)) return;
  try{
    if(r.file_path) await sb.storage.from(BUCKET).remove([r.file_path]);
    const { error } = await sb.from('library_resources').delete().eq('id',id);
    if(error) throw error;
    await loadResources();
  }catch(e){ console.error(e); alert('削除に失敗しました：'+(e.message||'')); }
}

      </div>
      <div class="form-group">

        <input id="pwAdmConf" type="password" autocomplete="new-password" placeholder="もう一度入力">
      </div>
    </div>

async function changePw(target){
  const isWard = (target==='ward');
  const newEl  = document.getElementById(isWard?'pwWardNew':'pwAdmNew');
  const confEl = document.getElementById(isWard?'pwWardConf':'pwAdmConf');
  const status = document.getElementById(isWard?'pwWardStatus':'pwAdmStatus');
  const btn    = document.getElementById(isWard?'pwWardBtn':'pwAdmBtn');
  const label  = isWard ? 'スタッフ用' : '管理者用';
  const pw = newEl.value, conf = confEl.value;
  if(pw.length < 6){ status.style.color='#c0392b'; status.textContent='パスワードは6文字以上にしてください'; return; }
  if(pw !== conf){   status.style.color='#c0392b'; status.textContent='確認用と一致しません'; return; }
  if(!confirm(`${label}パスワードを変更します。よろしいですか？`)) return;
  btn.disabled=true; status.style.color='var(--ink-soft)'; status.textContent='変更中…';
  // 管理者だけが叩ける専用関数（中で呼び出し元が管理者かを確認）
  const { error } = await sb.rpc('admin_set_password', { target, new_password: pw });
  if(error){
    status.style.color='#c0392b';
    status.textContent='エラー：'+(error.message||'変更に失敗しました（security_setup後の admin_set_password 関数は実行済みですか？）');
    btn.disabled=false; return;
  }
  status.style.color='var(--green)'; status.textContent=`${label}パスワードを変更しました`;
  newEl.value=''; confEl.value='';
  btn.disabled=false;
}

/* ====================== 活用状況（集計） ====================== */
function viewStats(){
  if(!resources.length){
    return `<div class="panel"><h2>📊 活用状況</h2><div class="empty">資料が登録されると、ここに活用状況が表示されます。</div></div>`;
  }
  const rows=[...resources].sort((a,b)=>b.views-a.views);
  let html=`<div class="panel"><h2>📊 活用状況 ― 資料の見直しに</h2>
    <div class="sort-note">閲覧数が多い順。👍率＝役に立った数 ÷ 閲覧数。仕分けの目安を自動表示します。</div>
    <table class="admin"><thead><tr>
      <th>タイトル</th><th>区分</th><th>年度</th><th>閲覧</th><th>👍</th><th>👍率</th><th>仕分けの目安</th>
    </tr></thead><tbody>`;
  rows.forEach(r=>{
    const rate = r.views>0 ? Math.round(r.likes/r.views*100) : 0;
    const j = judge(r, rate);
    html+=`<tr>
      <td><b>${esc(r.title)}</b></td>
      <td><span class="mini">${esc(r.category)}${r.subcategory?' / '+esc(r.subcategory):''}</span></td>
      <td><span class="mini">${esc(r.year||'—')}</span></td>
      <td>${r.views}</td><td>${r.likes}</td>
      <td>${r.views>0?rate+'%':'—'}</td>
      <td><span class="pill ${j.cls}">${j.label}</span></td>
    </tr>`;
  });
  html+=`</tbody></table>
    <div class="sort-note" style="margin-top:14px;line-height:1.9">
      <b>仕分けの目安</b>　
      <span class="pill good">良資料</span> よく見られ評価も高い／維持　
      <span class="pill fix">要修正</span> よく見られるが評価が低い／内容を見直し　
      <span class="pill bury">導線改善</span> 評価は高いが見られていない／周知・分類を見直し　
      <span class="pill low">整理検討</span> 見られず評価も少ない／統合・廃棄を検討
    </div></div>`;
  return html;
}
function judge(r, rate){
  const viewed = r.views >= 5;        // 「見られている」目安（運用しながら調整可）
  const liked  = rate >= 40;          // 「役に立っている」目安
  if(viewed && liked)  return {cls:'good', label:'良資料'};
  if(viewed && !liked) return {cls:'fix',  label:'要修正'};
  if(!viewed && r.likes>0 && liked) return {cls:'bury', label:'導線改善'};
  return {cls:'low', label:'整理検討'};
}

/* ---------------- ユーティリティ ---------------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
