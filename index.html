<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICU資料ライブラリ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     ▼▼▼ ① ここに Supabase の接続情報を貼ってください ▼▼▼
     STAT/VENT の index.html の先頭にある SUPABASE_URL と
     SUPABASE_ANON_KEY を、そのままコピーして下の JS（②）に貼ります。
     （このコメントは目印。実際の貼り付け場所は下の <script> 内）
     ============================================================ */

  :root{
    --bg:#f4f6f8; --surface:#ffffff; --ink:#1b2733; --ink-soft:#5b6b7b;
    --line:#e2e8ef; --teal:#0d8a8a; --teal-deep:#0a6b6b; --teal-soft:#e6f4f4;
    --blue:#2b6cb0; --green:#2f855a; --amber:#c05621; --purple:#7c5cbf;
    --shadow:0 1px 3px rgba(20,40,60,.08),0 6px 20px rgba(20,40,60,.06);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;line-height:1.6;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit;font-size:15px}

  /* ---------- ログイン ---------- */
  #login{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#0a6b6b,#0d8a8a 60%,#13a0a0);padding:20px;
  }
  .login-card{
    background:var(--surface);border-radius:20px;padding:40px 34px;width:100%;max-width:380px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:center;
  }
  .login-card .logo{font-size:34px}
  .login-card h1{font-size:21px;margin:10px 0 4px;letter-spacing:.02em}
  .login-card p{color:var(--ink-soft);font-size:13px;margin-bottom:24px}
  .field{text-align:left;margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px}
  .field input{
    width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;
    transition:border-color .15s;
  }
  .field input:focus{outline:none;border-color:var(--teal)}
  .btn-primary{
    width:100%;background:var(--teal);color:#fff;font-weight:700;padding:13px;
    border-radius:10px;font-size:15px;transition:background .15s;margin-top:6px;
  }
  .btn-primary:hover{background:var(--teal-deep)}
  .login-err{color:#c0392b;font-size:13px;min-height:18px;margin-top:10px}

  /* ---------- アプリ枠 ---------- */
  #app{display:none;min-height:100vh}
  header.topbar{
    background:var(--surface);border-bottom:1px solid var(--line);
    padding:0 20px;display:flex;align-items:center;gap:18px;height:60px;
    position:sticky;top:0;z-index:30;
  }
  .brand{font-weight:900;font-size:18px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
  .brand .dot{color:var(--teal)}
  .tabs{display:flex;gap:4px;margin-left:8px}
  .tab{
    padding:8px 16px;border-radius:9px;font-weight:700;font-size:14px;color:var(--ink-soft);
  }
  .tab.active{background:var(--teal-soft);color:var(--teal-deep)}
  .spacer{flex:1}
  .who{font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:10px}
  .who .role{background:var(--teal-soft);color:var(--teal-deep);padding:3px 10px;border-radius:20px;font-weight:700;font-size:12px}
  .logout{font-size:13px;color:var(--ink-soft);text-decoration:underline}
  .adminbtn{font-size:12px;font-weight:700;color:var(--teal-deep);background:var(--teal-soft);padding:5px 13px;border-radius:20px;white-space:nowrap}
  .adminbtn:hover{background:#d5ecec}

  main{max-width:1080px;margin:0 auto;padding:24px 20px 60px}

  /* ---------- 検索バー ---------- */
  .searchbar{position:relative;margin-bottom:22px}
  .searchbar input{
    width:100%;padding:13px 16px 13px 44px;border:1.5px solid var(--line);
    border-radius:12px;background:var(--surface);box-shadow:var(--shadow);
  }
  .searchbar input:focus{outline:none;border-color:var(--teal)}
  .searchbar .ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--ink-soft)}

  /* ---------- パンくず ---------- */
  .crumbs{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:18px;flex-wrap:wrap}
  .crumbs a{color:var(--teal-deep);font-weight:700;text-decoration:none;cursor:pointer}
  .crumbs span{color:var(--ink-soft)}

  /* ---------- カテゴリーカード ---------- */
  /* iPad13(横/縦)で全項目を見渡せるよう、アイコンは現状の30pxを維持しつつタイル幅をコンパクトに */
  .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(192px,1fr));gap:14px}
  .cat-card{
    background:var(--surface);border-radius:var(--radius);padding:20px 18px;box-shadow:var(--shadow);
    border:1px solid var(--line);text-align:left;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden;
  }
  .cat-card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(20,40,60,.12)}
  .cat-card .emoji{font-size:30px;line-height:1}
  .cat-card h3{font-size:18px;margin:9px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cat-card p{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cat-card .bar{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--bar,#0d8a8a)}
  .cat-card .count{margin-top:10px;font-size:12px;color:var(--ink-soft);font-weight:700;white-space:nowrap}
  .c-1{--bar:#d64545}  .c-2{--bar:#7c5cbf}  .c-3{--bar:#0d8a8a}  .c-4{--bar:#e0719c}
  .c-5{--bar:#b3242b}  .c-6{--bar:#4a6fa5}  .c-7{--bar:#2f855a}  .c-8{--bar:#2b6cb0}
  .c-9{--bar:#c05621}  .c-10{--bar:#9c6b3f} .c-11{--bar:#5b8a8a} .c-12{--bar:#607080}
  .c-13{--bar:#d98a1f} .c-14{--bar:#3d8ea3}
  .c-15{--bar:#9061c2} .c-16{--bar:#2f9e6b}

  /* ---------- サブカテゴリーチップ ---------- */
  .sub-grid{display:flex;flex-wrap:wrap;gap:10px}
  .sub-chip{
    background:var(--surface);border:1.5px solid var(--line);border-radius:30px;
    padding:10px 20px;font-weight:700;font-size:15px;box-shadow:var(--shadow);transition:.15s;white-space:nowrap;
  }
  .sub-chip:hover{border-color:var(--teal);color:var(--teal-deep)}
  .sub-chip .n{color:var(--ink-soft);font-weight:500;font-size:13px;margin-left:6px}

  /* ---------- 資料リスト ---------- */
  .res-list{display:flex;flex-direction:column;gap:10px}
  .list-sec{font-size:13px;font-weight:800;color:var(--ink-soft);margin:20px 2px 10px;padding-top:4px;border-top:1px solid var(--line)}
  .res-item{
    background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:12px;padding:16px 18px;
    box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;transition:.15s;text-align:left;width:100%;
  }
  .res-item:hover{border-color:var(--teal);transform:translateX(2px)}
  .res-item.is-check{border-left-color:var(--green)}
  .res-item.is-check:hover{border-color:var(--green)}
  .res-item.is-scale{border-left-color:var(--purple)}
  .res-item.is-scale:hover{border-color:var(--purple)}
  .res-item .pdf-ico{font-size:24px;flex-shrink:0}
  .res-item .meta{flex:1;min-width:0}
  .res-item .meta .t{font-weight:700;font-size:16px;margin-bottom:3px}
  .res-item .meta .sub{font-size:12px;color:var(--ink-soft)}
  .res-item .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
  .tag{background:var(--teal-soft);color:var(--teal-deep);font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
  .res-item .stat{font-size:12px;color:var(--ink-soft);text-align:right;flex-shrink:0;line-height:1.7}
  .res-item .stat b{color:var(--ink)}

  .empty{text-align:center;color:var(--ink-soft);padding:50px 20px;font-size:15px}

  /* ---------- 中項目セレクタ（本棚の上の絞り込みチップ） ---------- */
  .shelf-subbar{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 16px}
  .shelf-chip{
    background:var(--surface);border:1.5px solid var(--line);border-radius:30px;
    padding:7px 15px;font-weight:700;font-size:14px;color:var(--ink-soft);white-space:nowrap;transition:.12s;
  }
  .shelf-chip:hover{border-color:var(--teal);color:var(--teal-deep)}
  .shelf-chip.sel{background:var(--teal);border-color:var(--teal);color:#fff}
  .shelf-chip .n{font-weight:500;font-size:12px;margin-left:5px;opacity:.85}

  /* ---------- 本棚（表紙サムネイル一覧） ---------- */
  /* iPadで一目で見渡せるよう、A4比の表紙カードをグリッドで並べる。スクロールを最小化。 */
  .shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:18px 14px}
  .book{display:flex;flex-direction:column;gap:7px;text-align:left;background:none}
  .book-cover{
    position:relative;aspect-ratio:1 / 1.414;border-radius:8px;overflow:hidden;
    background:#eef2f5;border:1px solid var(--line);
    box-shadow:0 2px 8px rgba(20,40,60,.14);transition:transform .15s,box-shadow .15s;
  }
  .book:hover .book-cover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(20,40,60,.20)}
  .book-cover .spine{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--bar,#0d8a8a);opacity:.92;z-index:2}
  .book-cover .cover-img{
    width:100%;height:100%;object-fit:cover;object-position:top center;display:block;
    opacity:0;transition:opacity .3s;
  }
  .book-cover .cover-img.on{opacity:1}
  .book-cover .cover-ph{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);font-size:12px;text-align:center;padding:8px;
  }
  .book-cover .spin{
    width:22px;height:22px;border:2.5px solid #cdd6df;border-top-color:var(--teal);
    border-radius:50%;animation:shelfspin .8s linear infinite;
  }
  @keyframes shelfspin{to{transform:rotate(360deg)}}
  .book-cover .yb{
    position:absolute;right:6px;bottom:6px;z-index:2;background:rgba(255,255,255,.92);color:var(--ink);
    font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;box-shadow:0 1px 3px rgba(0,0,0,.18);
  }
  .book-title{
    font-size:13px;font-weight:700;line-height:1.35;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .book-sub{font-size:11px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media(max-width:620px){ .shelf{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px 10px} }

  /* ---------- PDFモーダル ---------- */
  .modal-bg{
    display:none;position:fixed;inset:0;background:rgba(10,30,40,.55);z-index:100;
    align-items:center;justify-content:center;padding:20px;
  }
  .modal-bg.show{display:flex}
  .pdf-modal{
    background:var(--surface);border-radius:16px;width:100%;max-width:900px;height:90vh;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .pdf-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}
  .pdf-head .t{font-weight:700;font-size:17px;flex:1;min-width:0}
  .pdf-head .x{font-size:22px;color:var(--ink-soft);padding:4px 8px}
  .pdf-frame{flex:1;border:none;width:100%;background:#525659}
  .pdf-view{flex:1;display:flex;flex-direction:column;min-height:0;background:#525659}
  .pdf-canvas-wrap{flex:1;min-height:0;overflow:hidden;display:flex;justify-content:center;align-items:center;padding:12px}
  #pdfCanvas{max-width:100%;max-height:100%;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.35);display:block}
  #pdfMsg{display:none;color:#e6edf2;font-size:14px;text-align:center;padding:40px 24px;line-height:1.7;align-self:center;margin:auto}
  .pdf-nav{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px;background:#3f4347}
  .pdf-nav button{color:#fff;font-weight:700;font-size:14px;padding:9px 18px;border-radius:8px;background:rgba(255,255,255,.14);transition:.12s}
  .pdf-nav button:hover{background:rgba(255,255,255,.26)}
  .pdf-nav button:disabled{opacity:.3;cursor:default}
  .pdf-nav #pdfPageInfo{color:#fff;font-size:14px;min-width:66px;text-align:center;font-weight:700}
  .pdf-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .like-btn{
    display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);
    border-radius:30px;padding:9px 18px;font-weight:700;font-size:15px;transition:.15s;color:var(--ink);white-space:nowrap;
  }
  .like-btn:hover{border-color:var(--teal)}
  .like-btn.liked{background:#fff4e6;border-color:var(--amber);color:var(--amber)}
  .pdf-foot .views{font-size:13px;color:var(--ink-soft)}
  .pdf-foot .dl{margin-left:auto;font-size:14px;color:var(--teal-deep);font-weight:700;text-decoration:none}

  /* ---------- 動画（YouTube埋め込み） ---------- */
  .video-wrap{flex:1;min-height:0;display:none;align-items:center;justify-content:center;padding:12px;background:#000}
  .video-box{width:100%;aspect-ratio:16/9;max-height:100%;background:#000}
  .video-box iframe{width:100%;height:100%;border:0;display:block}
  .pdf-view.video-mode .pdf-canvas-wrap{display:none}
  .pdf-view.video-mode .pdf-nav{display:none}
  .pdf-view.video-mode .video-wrap{display:flex}
  .pdf-foot .video-open{
    display:flex;align-items:center;gap:8px;background:#fdeaea;border:1.5px solid #e05a4f;
    border-radius:30px;padding:9px 18px;font-weight:700;font-size:15px;color:#b23a30;white-space:nowrap;
  }
  .pdf-foot .video-open:hover{background:#fbdcda}
  .pdf-foot .yt-link{font-size:13px;color:var(--ink-soft);font-weight:700;text-decoration:none;white-space:nowrap}

  /* ---------- 管理画面 ---------- */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:22px}
  .panel h2{font-size:17px;margin-bottom:18px;display:flex;align-items:center;gap:8px}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  .form-row.full{grid-template-columns:1fr}
  .form-group label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px}
  .form-group input,.form-group select{
    width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;background:#fff;
  }
  .form-group input:focus,.form-group select:focus{outline:none;border-color:var(--teal)}
  .hint{font-size:11px;color:var(--ink-soft);margin-top:4px}
  .file-drop{
    border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--ink-soft);
    cursor:pointer;transition:.15s;
  }
  .file-drop:hover{border-color:var(--teal);background:var(--teal-soft)}
  .file-drop.has{border-color:var(--teal);color:var(--teal-deep);background:var(--teal-soft);font-weight:700}
  .upload-status{font-size:13px;margin-top:10px;min-height:18px}

  table.admin{width:100%;border-collapse:collapse;font-size:14px}
  table.admin th,table.admin td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
  table.admin th{font-size:12px;color:var(--ink-soft);font-weight:700;text-transform:none}
  table.admin td .mini{font-size:12px;color:var(--ink-soft)}
  .pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
  .pill.good{background:#e6f6ec;color:#2f855a}
  .pill.fix{background:#fdecea;color:#c0392b}
  .pill.bury{background:#fef5e7;color:#c05621}
  .pill.low{background:#eef0f2;color:#5b6b7b}
  .row-act{display:flex;gap:8px}
  .row-act button{font-size:12px;font-weight:700;padding:5px 11px;border-radius:7px}
  .btn-edit{background:var(--teal-soft);color:var(--teal-deep)}
  .btn-del{background:#fdecea;color:#c0392b}
  .btn-add{background:var(--teal);color:#fff;font-weight:700;padding:11px 22px;border-radius:9px}
  .btn-ghost{background:#eef0f2;color:var(--ink);font-weight:700;padding:11px 22px;border-radius:9px}
  .sort-note{font-size:12px;color:var(--ink-soft);margin-bottom:10px}

  /* ---------- 付属ツール（チェックリスト・スケール） ---------- */
  .pdf-foot .tool-open{
    display:flex;align-items:center;gap:8px;background:var(--teal-soft);border:1.5px solid var(--teal);
    border-radius:30px;padding:9px 18px;font-weight:700;font-size:15px;color:var(--teal-deep);white-space:nowrap;
  }
  .pdf-foot .tool-open:hover{background:#d5ecec}
  .tool-bar-track{flex:1;height:8px;background:#eef0f2;border-radius:999px;overflow:hidden}
  .tool-bar-fill{height:100%;width:0;background:var(--green);transition:width .2s}
  .ck-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface);transition:.12s}
  .ck-row:hover{background:#f7fafa}
  .ck-row.done{background:#e6f6ec;border-color:#9ad3b0}
  .ck-box{width:22px;height:22px;border-radius:6px;border:1.6px solid #cdd6df;display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:#fff;font-size:14px;font-weight:700}
  .ck-row.done .ck-box{background:var(--green);border-color:var(--green)}
  .ck-row.done .ck-lbl{color:var(--green);font-weight:700}
  .ck-lbl{font-size:15px}
  .sc-item{margin-bottom:14px;break-inside:avoid;-webkit-column-break-inside:avoid}
  .sc-item .q{font-size:14px;margin-bottom:7px;font-weight:700;color:var(--ink)}
  /* 項目数の多いスケール（NIHSS等）は3列＋選択肢を横並びにして1画面に収める */
  #scList.multi{column-count:3;column-gap:14px}
  #scList.multi .sc-item{margin-bottom:10px}
  #scList.multi .sc-item .q{font-size:13px;margin-bottom:5px}
  #scList.multi .sc-opts{flex-direction:row;flex-wrap:wrap;gap:5px}
  #scList.multi .sc-opt{width:auto;flex:0 1 auto;padding:6px 9px;font-size:12px;gap:6px;border-radius:7px;line-height:1.3}
  #scList.multi .sc-opt .v{min-width:20px;height:20px;font-size:11px}
  @media(max-width:760px){ #scList.multi{column-count:2} }
  @media(max-width:480px){ #scList.multi{column-count:1} }
  .sc-chips{display:flex;gap:7px;flex-wrap:wrap}
  .sc-chip{min-width:42px;height:38px;padding:0 6px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);font-size:15px;font-weight:700;cursor:pointer;color:var(--ink-soft);transition:.12s}
  .sc-chip:hover{background:#f7fafa}
  .sc-chip.sel{background:var(--blue);border-color:var(--blue);color:#fff}
  .sc-opts{display:flex;flex-direction:column;gap:7px}
  .sc-opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);font-size:14px;color:var(--ink);cursor:pointer;transition:.12s;line-height:1.45}
  .sc-opt:hover{background:#f7fafa}
  .sc-opt.sel{background:var(--blue);border-color:var(--blue);color:#fff}
  .sc-opt .v{flex:0 0 auto;min-width:26px;height:26px;padding:0 4px;border-radius:6px;background:#eef0f2;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .sc-opt.sel .v{background:rgba(255,255,255,.28);color:#fff}
  .tool-reset{font-size:13px;font-weight:700;color:var(--ink-soft);background:#eef0f2;padding:7px 14px;border-radius:8px}
  .tool-reset:hover{background:#e2e6ea}
  .tool-total{font-size:13px;color:var(--ink-soft)}
  .tool-total b{font-size:26px;color:var(--ink);font-weight:900;margin:0 4px}

<script>
/* ============================================================

const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFlcGZ1b3Jjb2R3ZW54emFkYnRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NjE3MzIsImV4cCI6MjA5NTQzNzczMn0.woYxAkG8q4mgfeuHrGo5OpbuQioV-9QiQoI1uQFMwi8';

/* ============================================================

const ADMIN_EMAIL  = 'admin@icu.local';   // このアカウントだけ管理者扱い

const CATEGORIES = [
  { key:'循環器・心臓', cls:'c-1',  emoji:'🫀', desc:'心臓・循環の管理' },
  { key:'脳神経・脳',   cls:'c-2',  emoji:'🧠', desc:'脳・神経の管理' },

  { key:'感染・敗血症', cls:'c-7',  emoji:'🦠', desc:'感染対策・敗血症' },
  { key:'腎臓・透析',   cls:'c-8',  emoji:'💧', desc:'腎・透析/CRRT' },

  { key:'業務',         cls:'c-12', emoji:'📋', desc:'面会・駐車 など' },
  { key:'困ったとき',   cls:'c-13', emoji:'🆘', desc:'迷ったときの手引き' },
];
const BUCKET = 'library-files';

/* ---------------- 大項目の並び順（使用頻度＝閲覧数の合計が多い順） ----------------
   ・業務／困ったとき は常に末尾固定（よく探す位置が動かないように）
   ・それ以外（ベッドサイドファイル含む）は閲覧数の合計が多い順に自動で並ぶ
   ・閲覧数が同じ（0件含む）ときは CATEGORIES の元の順を保つ＝安定
   ※ベッドサイドファイルも固定したくなったら下の配列に 'ベッドサイドファイル' を足すだけ */
const PINNED_BOTTOM = ['業務','困ったとき'];
function categoryViews(catKey){
  return resources.filter(r=>r.category===catKey).reduce((s,r)=>s+(r.views||0),0);
}
function orderedCategories(){
  const idx = new Map(CATEGORIES.map((c,i)=>[c.key,i]));
  const main   = CATEGORIES.filter(c=>!PINNED_BOTTOM.includes(c.key));
  const pinned = CATEGORIES.filter(c=> PINNED_BOTTOM.includes(c.key));
  main.sort((a,b)=>{
    const va=categoryViews(a.key), vb=categoryViews(b.key);
    if(vb!==va) return vb-va;             // 閲覧数の多い順
    return idx.get(a.key)-idx.get(b.key); // 同数は元の順で安定
  });
  pinned.sort((a,b)=>idx.get(a.key)-idx.get(b.key)); // 業務→困ったとき の順を維持
  return [...main, ...pinned];
}

let sb = null;
let state = { role:null, nav:'browse', cat:null, sub:null, search:'' };
let imeComposing = false;   // 日本語IME変換中フラグ（変換途中の再描画を防ぐ）
let resources = [];          // 全資料キャッシュ
let current = null;          // プレビュー中の資料
const likedKey = 'icu_lib_liked';     // localStorage：👍済みID
const viewedKey = 'icu_lib_viewed';   // sessionStorage：閲覧済みID（重複カウント防止）

/* ---------------- 起動 ---------------- */
function initClient(){
  if(SUPABASE_URL.startsWith('ここに')||SUPABASE_ANON_KEY.startsWith('ここに')){
    return false;
  }
  if(!sb) sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  return true;
}
function roleFromEmail(email){ return (email||'').toLowerCase()===ADMIN_EMAIL ? 'admin' : 'ward'; }

window.addEventListener('DOMContentLoaded', async ()=>{
  if(window.pdfjsLib){ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'; }
  if(!initClient()){
    document.getElementById('loginErr').textContent='接続情報が未設定です（コード②を確認）';
    return;
  }
  document.getElementById('loginPw').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('adminPw').addEventListener('keydown',e=>{ if(e.key==='Enter') submitAdmin(); });
  // 既存のログインセッションがあれば復元
  const { data:{ session } } = await sb.auth.getSession();
  if(session && session.user){
    state.role = roleFromEmail(session.user.email);
    enterApp();
  }
});

/* ---------------- ログイン（パスワードのみ＝全員まず閲覧モード） ---------------- */
async function doLogin(){
  const pw = document.getElementById('loginPw').value;
  const err = document.getElementById('loginErr');
  if(!pw){ err.style.color='#c0392b'; err.textContent='パスワードを入力してください'; return; }
  err.textContent='ログイン中…'; err.style.color='var(--ink-soft)';
  // 入口は全員 ward アカウントでログイン（閲覧モード）
  const { data, error } = await sb.auth.signInWithPassword({ email: WARD_EMAIL, password: pw });
  if(error || !data.user){ err.style.color='#c0392b'; err.textContent='パスワードが違います'; return; }
  err.textContent='';
  state.role = roleFromEmail(data.user.email);
  enterApp();
}
async function doLogout(){
  try{ await sb.auth.signOut(); }catch(e){}
  location.reload();
}

/* ---------------- 管理者モードへ切替（裏で admin アカウントに再ログイン） ---------------- */
function openAdminPrompt(){
  document.getElementById('adminPw').value='';
  document.getElementById('adminErr').textContent='';
  document.getElementById('adminModal').classList.add('show');
  setTimeout(()=>document.getElementById('adminPw').focus(),50);
}
function closeAdminPrompt(){ document.getElementById('adminModal').classList.remove('show'); }
async function submitAdmin(){
  const pw  = document.getElementById('adminPw').value;
  const err = document.getElementById('adminErr');
  const btn = document.getElementById('adminSubmit');
  if(!pw){ err.style.color='#c0392b'; err.textContent='管理者パスワードを入力してください'; return; }
  btn.disabled=true; err.style.color='var(--ink-soft)'; err.textContent='切り替え中…';
  // 管理者アカウントへ再ログイン（これでRLSの書込権限が有効になる）
  const { data, error } = await sb.auth.signInWithPassword({ email: ADMIN_EMAIL, password: pw });
  if(error || !data.user){ err.style.color='#c0392b'; err.textContent='管理者パスワードが違います'; btn.disabled=false; return; }
  btn.disabled=false;
  state.role = roleFromEmail(data.user.email);   // → 'admin'
  closeAdminPrompt();
  // 画面を管理者用に更新
  state.nav='browse'; state.cat=null; state.sub=null; state.search='';
  document.getElementById('roleLabel').textContent='管理者';
  updateAdminBtn(); renderTabs();
  await loadResources();   // 管理者セッションで読み直し
}
function updateAdminBtn(){
  const b=document.getElementById('adminBtn');
  if(b) b.style.display = (state.role==='admin') ? 'none' : '';
}
// 追加フォームの大カテゴリー選択肢を CATEGORIES から生成（今後の項目追加もここ1か所でOK）
function buildCategorySelect(){
  const sel=document.getElementById('fCategory');
  if(sel) sel.innerHTML = CATEGORIES.map(c=>`<option value="${esc(c.key)}">${esc(c.key)}</option>`).join('');
}

function enterApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('roleLabel').textContent = state.role==='admin' ? '管理者' : '病棟';
  updateAdminBtn();
  buildCategorySelect();
  buildToolSelect();
  renderTabs();
  loadResources();
}

/* ---------------- タブ ---------------- */
function renderTabs(){
  const tabs = [{k:'browse',label:'資料を探す'},{k:'tools',label:'🧮 スケール・チェックリスト'}];
  if(state.role==='admin'){
    tabs.push({k:'manage',label:'資料を管理'});
    tabs.push({k:'stats',label:'活用状況'});
    tabs.push({k:'settings',label:'パスワード'});
  }
  document.getElementById('tabs').innerHTML = tabs.map(t=>
    `<button class="tab ${state.nav===t.k?'active':''}" onclick="goTab('${t.k}')">${t.label}</button>`
  ).join('');
}
function goTab(k){
  state.nav=k; state.cat=null; state.sub=null; state.search='';
  renderTabs(); render();
}

/* ---------------- データ取得 ---------------- */
async function loadResources(){
  const { data, error } = await sb.from('library_resources').select('*').order('created_at',{ascending:false});
  if(error){ console.error(error); resources=[]; }
  else { resources = data || []; }

}

// 検索欄を除いた「結果部分」だけを生成（入力のたびにここだけ差し替える）
function browseResults(){
  // 検索中
  if(state.search.trim()){
    const hits = resources.filter(r=> matchSearch(r, state.search));
    return `<div class="crumbs"><span>「${esc(state.search)}」の検索結果：${hits.length}件</span></div>`
      + (hits.length ? resListHtml(hits) : `<div class="empty">該当する資料がありません</div>`);
  }

  // カテゴリー一覧
  if(!state.cat){
    let html = `<div class="cat-grid">`;
    orderedCategories().forEach(cat=>{
      const n = resources.filter(r=>r.category===cat.key).length;
      html += `
        <button class="cat-card ${cat.cls}" onclick="openCat('${cat.key}')">
          <span class="bar"></span>
          <div class="emoji">${cat.emoji}</div>
          <h3>${cat.key}</h3>
          <p>${cat.desc}</p>
          <div class="count">${n} 件の資料</div>
        </button>`;
    });
    return html + `</div>`;
  }

  // 資料一覧（本棚表示）。中項目（サブカテゴリー）チップで同ページ内に絞り込み＝ページ移動なし
  const catObj = CATEGORIES.find(c=>c.key===state.cat);
  const catCls = catObj ? catObj.cls : '';
  const all = resources.filter(r=>r.category===state.cat);
  const subs = [...new Set(all.map(r=>r.subcategory).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
  const list = (state.sub ? all.filter(r=>(r.subcategory||'')===state.sub) : all)
    .slice()
    .sort((a,b)=>{
      const sa=(a.subcategory||'未分類'), sb=(b.subcategory||'未分類');
      if(sa!==sb) return sa.localeCompare(sb,'ja');
      return (a.title||'').localeCompare(b.title||'','ja');
    });

  let out = `<div class="crumbs"><a onclick="clearCat()">資料を探す</a><span>›</span><span>${esc(state.cat)}</span>`
          + (state.sub ? `<span>›</span><span>${esc(state.sub)}</span>` : '') + `</div>`;

  // 中項目（サブカテゴリー）が1つ以上あるときだけチップを出す
  if(subs.length){
    out += `<div class="shelf-subbar">`
         + `<button class="shelf-chip ${state.sub?'':'sel'}" data-sub="">すべて<span class="n">${all.length}</span></button>`;
    subs.forEach(s=>{
      const n = all.filter(r=>(r.subcategory||'')===s).length;
      out += `<button class="shelf-chip ${state.sub===s?'sel':''}" data-sub="${esc(s)}">${esc(s)}<span class="n">${n}</span></button>`;
    });
    out += `</div>`;
  }

  out += list.length
    ? bookshelfHtml(list, catCls)
    : `<div class="empty">${state.sub?'この中項目には資料がありません':'このカテゴリーにはまだ資料がありません'}</div>`;

  // チェックリスト・スケールは「すべて」表示のときだけ下に添える（絞り込み中は隠して1画面を優先）
  if(!state.sub){
    const tools = toolsInCat(state.cat);
    if(tools.length){
      out += `<div class="list-sec">✅ チェックリスト・🧮 スケール</div>` + toolListHtml(tools);
    }
  }
  return out;
}

    const yearBadge = r.year ? `<span class="tag" style="background:#eef0f2;color:#5b6b7b">${esc(r.year)}</span>` : '';

/* 表紙サムネイル：PDF1ページ目を小さく描画してキャッシュ（再訪時は即表示）
   ・メモリ＋localStorageの2段キャッシュ。file更新(updated_at)が変わればキー変更で自動更新
   ・IntersectionObserverで画面に入ったものだけ生成。同時実行は2件に制限（iPad負荷対策） */
const THUMB_W = 220;                 // 生成する表紙の横幅(px)。小さめに保ちデータ量を抑える
const thumbMem = {};                 // id -> dataURL（セッション内メモリ）
let thumbObserver = null;
let thumbQueue = [], thumbActive = 0;
const THUMB_CONC = 2;

function thumbKey(r){ return 'icu_lib_thumb:'+r.id+':'+(r.updated_at||r.created_at||''); }
function getThumbCached(r){
  if(thumbMem[r.id]) return thumbMem[r.id];
  try{ const v=localStorage.getItem(thumbKey(r)); if(v){ thumbMem[r.id]=v; return v; } }catch(e){}
  return null;
}
function setThumbCached(r, dataUrl){
  thumbMem[r.id]=dataUrl;
  try{ localStorage.setItem(thumbKey(r), dataUrl); }catch(e){ /* 容量超過などは無視 */ }
}
function applyThumb(imgEl, url){
  if(!imgEl) return;
  imgEl.onload=()=>{ imgEl.classList.add('on'); const ph=imgEl.parentElement&&imgEl.parentElement.querySelector('.cover-ph'); if(ph) ph.style.display='none'; };
  imgEl.src=url;
}
function markThumbFail(imgEl){
  const ph=imgEl&&imgEl.parentElement&&imgEl.parentElement.querySelector('.cover-ph');
  if(ph) ph.innerHTML='<span style="font-size:26px">📄</span>';
}
async function renderThumb(r){
  if(!window.pdfjsLib || !r.file_path) return null;
  const url=await fileUrl(r.file_path);
  if(!url) return null;
  let doc=null;
  try{
    doc=await pdfjsLib.getDocument(url).promise;
    const page=await doc.getPage(1);
    const base=page.getViewport({scale:1});
    const vp=page.getViewport({scale:THUMB_W/base.width});
    const canvas=document.createElement('canvas');
    canvas.width=Math.floor(vp.width); canvas.height=Math.floor(vp.height);
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
    await page.render({canvasContext:ctx, viewport:vp}).promise;
    return canvas.toDataURL('image/jpeg',0.72);
  }catch(e){ console.error('thumb',e); return null; }
  finally{ if(doc){ try{doc.destroy();}catch(_){} } }
}
function enqueueThumb(r, imgEl){
  const cached=getThumbCached(r);
  if(cached){ applyThumb(imgEl, cached); return; }
  thumbQueue.push({r, imgEl}); pumpThumb();
}
function pumpThumb(){
  while(thumbActive<THUMB_CONC && thumbQueue.length){
    const job=thumbQueue.shift(); thumbActive++;
    renderThumb(job.r)
      .then(u=>{ if(u){ setThumbCached(job.r,u); applyThumb(job.imgEl,u); } else { markThumbFail(job.imgEl); } })
      .catch(()=>markThumbFail(job.imgEl))
      .finally(()=>{ thumbActive--; pumpThumb(); });
  }
}
function wireBookshelf(){
  // 中項目チップの配線（サブカテゴリー名が自由入力＝記号混入に強い委譲方式）
  document.querySelectorAll('.shelf-chip[data-sub]').forEach(btn=>{
    btn.onclick=()=>{ const s=btn.getAttribute('data-sub'); if(s) openSub(s); else clearSub(); };
  });
  // 表紙サムネイルの遅延生成
  if(thumbObserver){ thumbObserver.disconnect(); }
  const covers=document.querySelectorAll('.book-cover[data-id]');
  if(!covers.length) return;
  thumbObserver=new IntersectionObserver((entries)=>{
    entries.forEach(en=>{
      if(!en.isIntersecting) return;
      const el=en.target, id=el.dataset.id;
      const r=resources.find(x=>x.id===id);
      const img=el.querySelector('.cover-img');
      if(r&&img) enqueueThumb(r, img);
      thumbObserver.unobserve(el);
    });
  }, {rootMargin:'250px'});
  covers.forEach(el=>thumbObserver.observe(el));
}

function onSearch(v){

function matchSearch(r,q){

    || (r.subcategory||'').toLowerCase().includes(s)
    || (r.category||'').toLowerCase().includes(s)

async function fileUrl(path){
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 3600);
  if(error){ console.error(error); return null; }
  return data.signedUrl;
}

/* ---------------- 動画（YouTube埋め込み） ---------------- */
// 各種YouTube URLから動画IDを取り出す。取れなければ null（＝ボタンを出さない）
function ytEmbed(url){
  if(!url) return null;
  const s = String(url).trim();
  if(!s) return null;
  let id=null, m;
  if((m = s.match(/[?&]v=([A-Za-z0-9_-]{6,})/)))            id = m[1];
  else if((m = s.match(/youtu\.be\/([A-Za-z0-9_-]{6,})/)))   id = m[1];
  else if((m = s.match(/\/embed\/([A-Za-z0-9_-]{6,})/)))     id = m[1];
  else if((m = s.match(/\/shorts\/([A-Za-z0-9_-]{6,})/)))    id = m[1];
  else if((m = s.match(/\/live\/([A-Za-z0-9_-]{6,})/)))      id = m[1];
  else if(/^[A-Za-z0-9_-]{11}$/.test(s))                     id = s;
  if(!id) return null;
  let start='';
  if((m = s.match(/[?&]t=(\d+)/))) start = '&start='+m[1];
  return {
    id,
    embed: 'https://www.youtube-nocookie.com/embed/'+id+'?rel=0&modestbranding=1&playsinline=1'+start,
    watch: 'https://www.youtube.com/watch?v='+id
  };
}

  }

  } else {

  if(!viewed.includes(r.id)){
    viewed.push(r.id); sessionStorage.setItem(viewedKey, JSON.stringify(viewed));

    r.views += 1;
    document.getElementById('viewCount').textContent = r.views;
  }
}
function closePdf(){

  document.getElementById('pdfModal').classList.remove('show');
  try{ if(pdfDoc){ pdfDoc.destroy(); } }catch(e){}
  pdfDoc=null;

}

/* ---------------- PDF.js ページ送り表示 ---------------- */
let pdfDoc=null, pdfPageNum=1, pdfRendering=false, pdfPendingNum=null;
function setPdfStatus(msg){
  const m=document.getElementById('pdfMsg'), c=document.getElementById('pdfCanvas');
  if(msg){ m.textContent=msg; m.style.display='flex'; c.style.display='none'; }
  else { m.style.display='none'; c.style.display='block'; }
}
function updatePdfNav(){
  const info=document.getElementById('pdfPageInfo');
  const prev=document.getElementById('pdfPrev'), next=document.getElementById('pdfNext');
  if(!pdfDoc){ info.textContent='– / –'; prev.disabled=true; next.disabled=true; return; }
  info.textContent=pdfPageNum+' / '+pdfDoc.numPages;
  prev.disabled=(pdfPageNum<=1);
  next.disabled=(pdfPageNum>=pdfDoc.numPages);
}
async function loadPdf(url){
  if(!window.pdfjsLib){ setPdfStatus('PDFビューアを読み込めませんでした。「ダウンロード」から開いてください。'); return; }
  try{
    pdfDoc = await pdfjsLib.getDocument(url).promise;
    pdfPageNum=1; updatePdfNav();
    renderPdfPage(1);
  }catch(e){
    console.error(e);
    setPdfStatus('PDFを表示できませんでした。「ダウンロード」から開いてください。');
  }
}
async function renderPdfPage(num){
  if(!pdfDoc) return;
  if(pdfRendering){ pdfPendingNum=num; return; }
  pdfRendering=true;
  try{
    const page=await pdfDoc.getPage(num);
    const wrap=document.getElementById('pdfCanvasWrap');
    const canvas=document.getElementById('pdfCanvas');
    const ctx=canvas.getContext('2d');
    const base=page.getViewport({scale:1});
    // 幅と高さ両方に収まる倍率＝ページ全体が1画面に収まる（縦スクロールを出さない）
    const availW=Math.max(200,(wrap.clientWidth||600)-24);
    const availH=Math.max(200,(wrap.clientHeight||600)-24);
    const scale=Math.min(availW/base.width, availH/base.height);
    const dpr=window.devicePixelRatio||1;
    const vp=page.getViewport({scale});
    canvas.width=Math.floor(vp.width*dpr);
    canvas.height=Math.floor(vp.height*dpr);
    canvas.style.width=Math.floor(vp.width)+'px';
    canvas.style.height=Math.floor(vp.height)+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    await page.render({canvasContext:ctx, viewport:vp}).promise;
    setPdfStatus('');
    wrap.scrollTop=0;
  }catch(e){ console.error(e); }
  pdfRendering=false;
  if(pdfPendingNum!=null){ const n=pdfPendingNum; pdfPendingNum=null; renderPdfPage(n); }
}
function pdfPage(d){
  if(!pdfDoc) return;
  const n=pdfPageNum+d;
  if(n<1||n>pdfDoc.numPages) return;
  pdfPageNum=n; updatePdfNav(); renderPdfPage(n);
}
let pdfResizeTimer=null;
window.addEventListener('resize',()=>{
  if(!pdfDoc) return;
  if(!document.getElementById('pdfModal').classList.contains('show')) return;
  clearTimeout(pdfResizeTimer);
  pdfResizeTimer=setTimeout(()=>renderPdfPage(pdfPageNum),200);
});
function getLiked(){ return JSON.parse(localStorage.getItem(likedKey)||'[]'); }
async function toggleLike(){
  if(!current) return;
  let liked = getLiked();
  const has = liked.includes(current.id);
  const delta = has ? -1 : 1;
  // UI即時反映
  if(has){ liked = liked.filter(x=>x!==current.id); }
  else { liked.push(current.id); }
  localStorage.setItem(likedKey, JSON.stringify(liked));
  current.likes = Math.max(0, current.likes + delta);
  document.getElementById('likeBtn').classList.toggle('liked', !has);
  document.getElementById('likeCount').textContent = current.likes;
  await sb.rpc('change_like',{resource_id:current.id, delta});
}

    document.getElementById('fSub').value='';
    document.getElementById('fYear').value='';
    document.getElementById('fTags').value='';
    document.getElementById('fVideo').value='';
    document.getElementById('fTool').value='';
    drop.textContent='クリックしてPDFを選択（PDFのみ）';
    drop.classList.remove('has');
    document.getElementById('fileHint').textContent='';
  }
  refreshSubDatalist(); refreshTagDatalist(); refreshYearDatalist();
  document.getElementById('formModal').classList.add('show');
}
function closeForm(){ document.getElementById('formModal').classList.remove('show'); }
function onFilePick(){
  const f = document.getElementById('fileInput').files[0];
  const drop=document.getElementById('fileDrop');
  if(!f) return;
  if(f.type!=='application/pdf'){
    document.getElementById('fileHint').textContent='PDFファイルを選んでください';
    document.getElementById('fileInput').value=''; return;
  }
  drop.textContent='📄 '+f.name; drop.classList.add('has');
  document.getElementById('fileHint').textContent=(f.size/1024/1024).toFixed(1)+' MB';
}
function refreshSubDatalist(){
  const cat=document.getElementById('fCategory').value;
  const subs=[...new Set(resources.filter(r=>r.category===cat).map(r=>r.subcategory).filter(Boolean))];
  document.getElementById('subList').innerHTML = subs.map(s=>`<option value="${esc(s)}">`).join('');
}
function refreshTagDatalist(){
  const tags=[...new Set(resources.flatMap(r=>r.tags||[]))];
  document.getElementById('tagList').innerHTML = tags.map(t=>`<option value="${esc(t)}">`).join('');
}
function refreshYearDatalist(){
  // よく使う年度の候補 ＋ 既存資料で使われている年度
  const base=['令和8年度','令和7年度','令和6年度','令和5年度','令和4年度'];
  const used=resources.map(r=>r.year).filter(Boolean);
  const years=[...new Set([...used, ...base])];
  document.getElementById('yearList').innerHTML = years.map(y=>`<option value="${esc(y)}">`).join('');
}

async function submitForm(){
  const title=document.getElementById('fTitle').value.trim();
  const category=document.getElementById('fCategory').value;
  const sub=document.getElementById('fSub').value.trim();
  const year=document.getElementById('fYear').value.trim();
  const tags=document.getElementById('fTags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const toolKey=document.getElementById('fTool').value||null;
  const videoRaw=document.getElementById('fVideo').value.trim();
  const file=document.getElementById('fileInput').files[0];
  const status=document.getElementById('formStatus');
  const btn=document.getElementById('formSubmit');

  if(!title){ status.style.color='#c0392b'; status.textContent='タイトルを入力してください'; return; }
  if(!editingId && !file){ status.style.color='#c0392b'; status.textContent='PDFファイルを選択してください'; return; }
  if(videoRaw && !ytEmbed(videoRaw)){
    status.style.color='#c0392b';
    status.textContent='YouTubeのURLとして読み取れません（例：https://www.youtube.com/watch?v=xxxxxxxxxxx）';
    return;
  }
  const videoUrl = videoRaw || null;

  btn.disabled=true; status.style.color='var(--ink-soft)'; status.textContent='保存中…';
  try{
    let filePath = null;
    if(file){
      const safe = file.name.replace(/[^\w.\-]/g,'_');
      filePath = `${category}/${Date.now()}_${safe}`;
      const { error:upErr } = await sb.storage.from(BUCKET).upload(filePath, file, {contentType:'application/pdf'});
      if(upErr) throw upErr;
    }
    if(editingId){
      const patch={ title, category, subcategory:sub, year, tags, tool_key:toolKey, video_url:videoUrl, updated_at:new Date().toISOString() };
      if(filePath) patch.file_path=filePath;
      const { error } = await sb.from('library_resources').update(patch).eq('id',editingId);
      if(error) throw error;
    } else {
      const { error } = await sb.from('library_resources').insert({ title, category, subcategory:sub, year, tags, tool_key:toolKey, video_url:videoUrl, file_path:filePath });
      if(error) throw error;
    }
    status.style.color='var(--green)'; status.textContent='保存しました';
    await loadResources();
    setTimeout(closeForm,500);
  }catch(e){
    console.error(e);
    status.style.color='#c0392b'; status.textContent='エラー：'+(e.message||'保存に失敗しました');
  }finally{ btn.disabled=false; }
}

async function delResource(id){
  const r=resources.find(x=>x.id===id);
  if(!r) return;
  if(!confirm(`「${r.title}」を削除します。よろしいですか？`)) return;
  try{
    if(r.file_path) await sb.storage.from(BUCKET).remove([r.file_path]);
    const { error } = await sb.from('library_resources').delete().eq('id',id);
    if(error) throw error;
    await loadResources();
  }catch(e){ console.error(e); alert('削除に失敗しました：'+(e.message||'')); }
}

async function changePw(target){
  const isWard = (target==='ward');
  const newEl  = document.getElementById(isWard?'pwWardNew':'pwAdmNew');
  const confEl = document.getElementById(isWard?'pwWardConf':'pwAdmConf');
  const status = document.getElementById(isWard?'pwWardStatus':'pwAdmStatus');
  const btn    = document.getElementById(isWard?'pwWardBtn':'pwAdmBtn');
  const label  = isWard ? 'スタッフ用' : '管理者用';
  const pw = newEl.value, conf = confEl.value;
  if(pw.length < 6){ status.style.color='#c0392b'; status.textContent='パスワードは6文字以上にしてください'; return; }
  if(pw !== conf){   status.style.color='#c0392b'; status.textContent='確認用と一致しません'; return; }
  if(!confirm(`${label}パスワードを変更します。よろしいですか？`)) return;
  btn.disabled=true; status.style.color='var(--ink-soft)'; status.textContent='変更中…';
  // 管理者だけが叩ける専用関数（中で呼び出し元が管理者かを確認）
  const { error } = await sb.rpc('admin_set_password', { target, new_password: pw });
  if(error){
    status.style.color='#c0392b';
    status.textContent='エラー：'+(error.message||'変更に失敗しました（security_setup後の admin_set_password 関数は実行済みですか？）');
    btn.disabled=false; return;
  }
  status.style.color='var(--green)'; status.textContent=`${label}パスワードを変更しました`;
  newEl.value=''; confEl.value='';
  btn.disabled=false;
}

/* ====================== 活用状況（集計） ====================== */
function viewStats(){
  if(!resources.length){
    return `<div class="panel"><h2>📊 活用状況</h2><div class="empty">資料が登録されると、ここに活用状況が表示されます。</div></div>`;
  }
  const rows=[...resources].sort((a,b)=>b.views-a.views);
  let html=`<div class="panel"><h2>📊 活用状況 ― 資料の見直しに</h2>
    <div class="sort-note">閲覧数が多い順。👍率＝役に立った数 ÷ 閲覧数。仕分けの目安を自動表示します。</div>
    <table class="admin"><thead><tr>
      <th>タイトル</th><th>区分</th><th>年度</th><th>閲覧</th><th>👍</th><th>👍率</th><th>仕分けの目安</th>
    </tr></thead><tbody>`;
  rows.forEach(r=>{
    const rate = r.views>0 ? Math.round(r.likes/r.views*100) : 0;
    const j = judge(r, rate);
    html+=`<tr>
      <td><b>${esc(r.title)}</b></td>
      <td><span class="mini">${esc(r.category)}${r.subcategory?' / '+esc(r.subcategory):''}</span></td>
      <td><span class="mini">${esc(r.year||'—')}</span></td>
      <td>${r.views}</td><td>${r.likes}</td>
      <td>${r.views>0?rate+'%':'—'}</td>
      <td><span class="pill ${j.cls}">${j.label}</span></td>
    </tr>`;
  });
  html+=`</tbody></table>
    <div class="sort-note" style="margin-top:14px;line-height:1.9">
      <b>仕分けの目安</b>　
      <span class="pill good">良資料</span> よく見られ評価も高い／維持　
      <span class="pill fix">要修正</span> よく見られるが評価が低い／内容を見直し　
      <span class="pill bury">導線改善</span> 評価は高いが見られていない／周知・分類を見直し　
      <span class="pill low">整理検討</span> 見られず評価も少ない／統合・廃棄を検討
    </div></div>`;
  return html;
}
function judge(r, rate){
  const viewed = r.views >= 5;        // 「見られている」目安（運用しながら調整可）
  const liked  = rate >= 40;          // 「役に立っている」目安
  if(viewed && liked)  return {cls:'good', label:'良資料'};
  if(viewed && !liked) return {cls:'fix',  label:'要修正'};
  if(!viewed && r.likes>0 && liked) return {cls:'bury', label:'導線改善'};
  return {cls:'low', label:'整理検討'};
}

function getTool(key){ return TOOLS.find(t=>t.key===key) || null; }
function toolsInCat(cat){ return TOOLS.filter(t=>t.category===cat); }
function toolMeta(t){
  if(t.type==='protocol')  return { emoji:'🚨', label:'プロトコル・フロー', cls:'is-proto' };
  if(t.type==='checklist') return { emoji:'✅', label:'チェックリスト',      cls:'is-check' };
  return { emoji:'🧮', label:'スケール', cls:'is-scale' };
}
function viewTools(){
  const protos = TOOLS.filter(t=>t.type==='protocol');
  const checks = TOOLS.filter(t=>t.type==='checklist');
  const scales = TOOLS.filter(t=>t.type!=='checklist' && t.type!=='protocol');
  let html = `<div class="crumbs"><span>スケール・チェックリスト集</span></div>`;
  if(protos.length){ html += `<div class="list-sec">🚨 プロトコル・フロー</div>` + toolListHtml(protos); }
  if(checks.length){ html += `<div class="list-sec">✅ チェックリスト</div>` + toolListHtml(checks); }
  if(scales.length){ html += `<div class="list-sec">🧮 スケール</div>` + toolListHtml(scales); }
  if(!protos.length && !checks.length && !scales.length){ html += `<div class="empty">ツールがありません</div>`; }
  return html;
}
function toolListHtml(tools){
  return `<div class="res-list">` + tools.map(t=>{
    const m = toolMeta(t);
    return `
      <button class="res-item ${m.cls}" onclick="openTool('${t.key}')">
        <span class="pdf-ico">${m.emoji}</span>
        <span class="meta">
          <span class="t">${esc(t.title)}</span>
          <span class="sub">${m.label}</span>
        </span>
      </button>`;
  }).join('') + `</div>`;
}
function buildToolSelect(){
  const sel=document.getElementById('fTool');
  if(!sel) return;
  const opts=['<option value="">なし</option>'].concat(
    TOOLS.map(t=>{ const m=toolMeta(t); return `<option value="${esc(t.key)}">${m.emoji} ${esc(t.title)}（${m.label}）</option>`; })
  );
  sel.innerHTML=opts.join('');
}
const checkKey=(k)=>'icu_lib_check_'+k;

let toolCur=null;
function openTool(key){
  const t=getTool(key); if(!t) return;
  toolCur=t;
  const card=document.getElementById('toolCard');
  if(card){
    card.style.maxWidth =
      t.type==='protocol' ? 'min(880px,96vw)'
      : (t.type==='scale' && t.items && t.items.length>=10) ? 'min(1000px,95vw)'
      : '520px';
  }
  document.getElementById('toolTitle').textContent=t.title;
  const body=document.getElementById('toolBody');
  if(t.type==='checklist'){ body.innerHTML=checklistHtml(t); }
  else if(t.type==='single'){ body.innerHTML=singleHtml(t); }
  else if(t.type==='protocol'){ body.innerHTML=protocolHtml(t); }
  else if(t.type==='camicu'){ body.innerHTML=camicuHtml(t); }
  else { body.innerHTML=scaleHtml(t); }
  document.getElementById('toolModal').classList.add('show');
  if(t.type==='checklist') wireChecklist();
  else if(t.type==='single') wireSingle();
  else if(t.type==='protocol'){ /* 表示専用：配線なし */ }
  else if(t.type==='camicu') wireCamicu();
  else wireScale();
}

/* ---- Code Heart：プロトコル・フロー（表示専用）の描画 ---- */
function protocolHtml(t){
  const arrow = `<div class="ch-arrow">↓</div>`;
  let h = `<div class="ch-wrap">`;
  if(t.target) h += `<div class="ch-target">${esc(t.target)}</div>`;
  (t.trunk||[]).forEach((n,i)=>{
    if(i>0) h += arrow;
    if(typeof n==='string'){ h += `<div class="ch-node">${esc(n)}</div>`; }
    else {
      h += `<div class="ch-node ${n.key?'key':''}">${esc(n.text)}</div>`;
      if(n.cap) h += `<div class="ch-cap">${esc(n.cap)}</div>`;
    }
  });
  h += arrow;
  h += `<div class="ch-cols">`;
  (t.branches||[]).forEach(col=>{
    h += `<div class="ch-col ${esc(col.cls)}"><div class="ch-hd">${esc(col.head)}</div><div class="ch-bd">`;
    (col.items||[]).forEach(it=>{
      if(it.set!=null){
        h += `<div class="ch-sub">${it.lb?`<span class="lb">${esc(it.lb)}</span>`:''}<div class="ch-set">${esc(it.set)}</div></div>`;
      } else if(it.dose!=null){
        h += `<div class="ch-sub"><span class="ch-dose">${esc(it.dose)}</span></div>`;
      } else {
        h += `<div class="ch-sub">${it.lb?`<span class="lb">${esc(it.lb)}</span>`:''}<span class="bd">${esc(it.body)}</span></div>`;
      }
    });
    h += `</div></div>`;
  });
  h += `</div>`;
  h += arrow;
  h += `<div class="ch-conv">${esc(t.converge)}</div>`;
  if(t.warn)   h += `<div class="ch-warn">${esc(t.warn)}</div>`;
  if(t.source) h += `<div class="tool-note" style="text-align:center;margin-top:10px">${esc(t.source)}</div>`;
  h += `</div>`;
  return h;
}
function closeTool(){ document.getElementById('toolModal').classList.remove('show'); }

/* ---- チェックリスト ---- */
function checklistHtml(t){
  let saved=[]; try{ saved=JSON.parse(localStorage.getItem(checkKey(t.key))||'[]'); }catch(e){ saved=[]; }
  const done=saved.filter(i=>i<t.items.length).length;
  const rows=t.items.map((it,i)=>{
    const d=saved.includes(i);
    return `<div class="ck-row ${d?'done':''}" data-i="${i}"><span class="ck-box">${d?'✓':''}</span><span class="ck-lbl">${esc(it)}</span></div>`;
  }).join('');
  return `
    <div style="margin-bottom:12px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <span id="ckCount" style="font-size:13px;color:var(--ink-soft)">${done}/${t.items.length} 完了</span>
        <button class="tool-reset" onclick="resetChecklist()">リセット</button>
      </div>
      <div class="tool-bar-track"><div class="tool-bar-fill" id="ckFill" style="width:${Math.round(done/t.items.length*100)}%"></div></div>
    </div>
    <div id="ckList" style="display:flex;flex-direction:column;gap:8px">${rows}</div>
    <div class="tool-note">チェックはリセットを押すまで保持されます（この端末のみ）</div>`;
}
function wireChecklist(){
  document.querySelectorAll('#ckList .ck-row').forEach(row=>{
    row.addEventListener('click',()=>{
      row.classList.toggle('done');
      row.querySelector('.ck-box').textContent = row.classList.contains('done') ? '✓' : '';
      saveChecklist(); refreshChecklist();
    });
  });
}
function curCheckedIdx(){ return [...document.querySelectorAll('#ckList .ck-row.done')].map(r=>+r.dataset.i); }
function saveChecklist(){ if(toolCur) localStorage.setItem(checkKey(toolCur.key), JSON.stringify(curCheckedIdx())); }
function refreshChecklist(){
  if(!toolCur) return;
  const total=toolCur.items.length, done=curCheckedIdx().length;
  document.getElementById('ckCount').textContent=done+'/'+total+' 完了';
  document.getElementById('ckFill').style.width=Math.round(done/total*100)+'%';
}
function resetChecklist(){
  document.querySelectorAll('#ckList .ck-row').forEach(r=>{ r.classList.remove('done'); r.querySelector('.ck-box').textContent=''; });
  saveChecklist(); refreshChecklist();
}

/* ---- 共通フッター（補足・出典・要確認） ---- */
function toolFooter(t){
  const note = t.note ? `<div class="tool-note">${esc(t.note)}</div>` : '';
  const src  = t.source ? `<div class="tool-note">出典：${esc(t.source)}</div>` : '';
  return `${note}${src}<div class="tool-note">※たたき台です。実運用前に、貴施設の正式版・最新版で確認してください。</div>`;
}

/* ---- スケール（合計型：各項目で1つ選び加算） ---- */
function scaleHtml(t){
  const items=t.items.map((it,i)=>{
    const opts=it.opts.map(o=>`<button class="sc-opt" data-v="${o.v}"><span class="v">${o.v}</span><span>${esc(o.t)}</span></button>`).join('');
    return `<div class="sc-item"><div class="q">${esc(it.q)}</div><div class="sc-opts" data-i="${i}">${opts}</div></div>`;
  }).join('');
  const hasBands=(t.bands||[]).length>0;
  return `
    <div id="scList" class="${t.items.length>=10?'multi':''}">${items}</div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
      <span class="tool-total">合計<b id="scTotal">0</b>点</span>
      <div style="display:flex;align-items:center;gap:10px">
        ${hasBands?`<span class="tool-band" id="scBand">未選択</span>`:''}
        <button class="tool-reset" onclick="resetScale()">リセット</button>
      </div>
    </div>
    ${toolFooter(t)}`;
}
function wireScale(){
  document.querySelectorAll('#scList .sc-opts').forEach(group=>{
    group.querySelectorAll('.sc-opt').forEach(c=>{
      c.addEventListener('click',()=>{
        const was=c.classList.contains('sel');
        group.querySelectorAll('.sc-opt').forEach(x=>x.classList.remove('sel'));
        if(!was) c.classList.add('sel');
        refreshScale();
      });
    });
  });
  refreshScale();
}
function refreshScale(){
  if(!toolCur) return;
  let total=0, anySel=false;
  document.querySelectorAll('#scList .sc-opts').forEach(group=>{
    const s=group.querySelector('.sc-opt.sel');
    if(s){ total+=(+s.dataset.v); anySel=true; }
  });
  document.getElementById('scTotal').textContent=total;
  const band=document.getElementById('scBand');
  if(!band) return;
  if(!anySel){ band.className='tool-band'; band.textContent='未選択'; return; }
  const b=(toolCur.bands||[]).find(x=>total<=x.max) || {cls:'',label:'—'};
  band.className='tool-band '+b.cls;
  band.textContent=b.label+'（目安）';
}
function resetScale(){
  document.querySelectorAll('#scList .sc-opt').forEach(c=>c.classList.remove('sel'));
  refreshScale();
}

/* ---- 単一選択型（RASS：1つだけ選ぶ） ---- */
function singleHtml(t){
  const opts=t.opts.map(o=>`<button class="sc-opt" data-v="${o.v}"><span class="v">${o.v>0?'+'+o.v:o.v}</span><span>${esc(o.t)}</span></button>`).join('');
  return `
    <div id="scSingle" class="sc-opts">${opts}</div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
      <span class="tool-total">判定<b id="scResult">—</b></span>
      <button class="tool-reset" onclick="resetSingle()">リセット</button>
    </div>
    ${toolFooter(t)}`;
}
function wireSingle(){
  document.querySelectorAll('#scSingle .sc-opt').forEach(c=>{
    c.addEventListener('click',()=>{
      const was=c.classList.contains('sel');
      document.querySelectorAll('#scSingle .sc-opt').forEach(x=>x.classList.remove('sel'));
      if(!was) c.classList.add('sel');
      refreshSingle();
    });
  });
  refreshSingle();
}
function refreshSingle(){
  const r=document.getElementById('scResult');
  const s=document.querySelector('#scSingle .sc-opt.sel');
  if(!s){ r.textContent='—'; return; }
  const v=+s.dataset.v;
  r.textContent=(v>0?'+'+v:String(v));
}
function resetSingle(){
  document.querySelectorAll('#scSingle .sc-opt').forEach(c=>c.classList.remove('sel'));
  refreshSingle();
}

/* ---- CAM-ICU（判定ロジック型：所見1かつ2かつ(3or4)で陽性） ---- */
function camicuHtml(t){
  const grp=(k,q,a,b)=>`
    <div class="sc-item"><div class="q">${q}</div>
      <div class="sc-opts cam-grp" data-k="${k}">
        <button class="sc-opt" data-v="${a.v}"><span>${a.t}</span></button>
        <button class="sc-opt" data-v="${b.v}"><span>${b.t}</span></button>
      </div></div>`;
  return `
    ${grp('gate','① 意識レベル（RASS）',{v:'awake',t:'覚醒〜浅い鎮静（RASS −3〜+4）'},{v:'coma',t:'深い鎮静・昏睡（RASS −4/−5）'})}
    ${grp('f1','所見1：急性発症 または 変動する経過',{v:'pos',t:'陽性（あり）'},{v:'neg',t:'陰性（なし）'})}
    ${grp('f2','所見2：注意力欠如',{v:'pos',t:'陽性（あり）'},{v:'neg',t:'陰性（なし）'})}
    ${grp('f3','所見3：意識レベルの変化（現在のRASSが0以外）',{v:'pos',t:'陽性（RASS≠0）'},{v:'neg',t:'陰性（RASS=0）'})}
    ${grp('f4','所見4：無秩序な思考',{v:'pos',t:'陽性（あり）'},{v:'neg',t:'陰性（なし）'})}
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
      <span class="tool-total">判定 <span class="tool-band" id="camBand" style="margin-left:6px">未評価</span></span>
      <button class="tool-reset" onclick="resetCam()">リセット</button>
    </div>
    ${toolFooter(t)}`;
}
function wireCamicu(){
  document.querySelectorAll('.cam-grp').forEach(group=>{
    group.querySelectorAll('.sc-opt').forEach(c=>{
      c.addEventListener('click',()=>{
        const was=c.classList.contains('sel');
        group.querySelectorAll('.sc-opt').forEach(x=>x.classList.remove('sel'));
        if(!was) c.classList.add('sel');
        refreshCam();
      });
    });
  });
  refreshCam();
}
function camSel(k){ const s=document.querySelector('.cam-grp[data-k="'+k+'"] .sc-opt.sel'); return s?s.dataset.v:null; }
function camResult(gate,f1,f2,f3,f4){
  if(!gate) return {cls:'',txt:'未評価'};
  if(gate==='coma') return {cls:'',txt:'評価不能（UTA：深鎮静・昏睡）'};
  if(!f1||!f2) return {cls:'',txt:'所見1・2を選択'};
  if(f1==='neg'||f2==='neg') return {cls:'b-ok',txt:'せん妄なし（陰性）'};
  if(f3==='pos'||f4==='pos') return {cls:'b-bad',txt:'せん妄あり（陽性）'};
  if(f3==='neg'&&f4==='neg') return {cls:'b-ok',txt:'せん妄なし（陰性）'};
  return {cls:'',txt:'所見3・4を選択'};
}
function refreshCam(){
  const band=document.getElementById('camBand'); if(!band) return;
  const r=camResult(camSel('gate'),camSel('f1'),camSel('f2'),camSel('f3'),camSel('f4'));
  band.className='tool-band '+r.cls; band.textContent=r.txt;
}
function resetCam(){ document.querySelectorAll('.cam-grp .sc-opt').forEach(c=>c.classList.remove('sel')); refreshCam(); }

/* ---------------- ユーティリティ ---------------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
</script>
